name: Mirror to GitLab

# Keeps gitlab.com/publicreason/orp as a shadow of this repository: every push to main (and every tag)
# is force-pushed to the GitLab remote. GitHub is canonical; GitLab is the open-source-hosted mirror.
# One-time setup: in GitLab, Settings → Access tokens → project access token with `write_repository`
# (role Maintainer), then add it here as the repository secret GITLAB_MIRROR_TOKEN.

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: ${{ vars.GITLAB_MIRROR_DISABLED != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Push to GitLab
        env:
          TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "GITLAB_MIRROR_TOKEN secret is not set; skipping mirror"; exit 0; }
          git remote add gitlab "https://oauth2:${TOKEN}@gitlab.com/publicreason/orp.git"
          git push gitlab "refs/remotes/origin/main:refs/heads/main"
          git push gitlab --tags
