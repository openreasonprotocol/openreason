name: Release to PyPI

# Publishes orp-validator when a v* tag is pushed, using PyPI trusted publishing (OIDC).
# One-time setup on PyPI (project orp-validator → Publishing → Add a new publisher):
#   owner: openreasonprotocol · repository: openreason · workflow: release.yml · environment: pypi
# No API token is stored anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" build twine
      - run: pytest tests/ -q
      - run: orp conform
      - name: Tag must match package version
        run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          test "$PKG" = "$TAG" || { echo "pyproject version $PKG != tag $TAG"; exit 1; }
      - run: python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
