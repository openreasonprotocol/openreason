# GitLab CI/CD Pipeline for OpenReason Protocol

# Default image for all jobs
image: python:3.11

# Cache pip packages between jobs
cache:
  paths:
    - .cache/pip
    - .venv/

# Define stages
stages:
  - lint
  - test
  - build

# Before script for all jobs - set up virtual environment
before_script:
  - python --version
  - pip install --upgrade pip
  - python -m venv .venv
  - source .venv/bin/activate
  - pip install -e ".[dev]"

# Code quality checks
lint:black:
  stage: lint
  script:
    - black --check orp_validator/ tests/
  only:
    - merge_requests
    - main

lint:ruff:
  stage: lint
  script:
    - ruff check orp_validator/ tests/
  only:
    - merge_requests
    - main

lint:mypy:
  stage: lint
  script:
    - mypy orp_validator/
  allow_failure: true  # Don't block on type errors initially
  only:
    - merge_requests
    - main

# Test jobs
test:unit:
  stage: test
  script:
    - pytest tests/ -v --cov=orp_validator --cov-report=term --cov-report=xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  only:
    - merge_requests
    - main

# Test on multiple Python versions
test:python3.9:
  stage: test
  image: python:3.9
  script:
    - pytest tests/ -v
  only:
    - merge_requests
    - main

test:python3.10:
  stage: test
  image: python:3.10
  script:
    - pytest tests/ -v
  only:
    - merge_requests
    - main

test:python3.11:
  stage: test
  image: python:3.11
  script:
    - pytest tests/ -v
  only:
    - merge_requests
    - main

test:python3.12:
  stage: test
  image: python:3.12
  script:
    - pytest tests/ -v
  only:
    - merge_requests
    - main

# Build package
build:package:
  stage: build
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
    - tags

# Validate ORP documents in the repository
validate:examples:
  stage: test
  script:
    - orp-validate examples/danish_property_tax_reform.md --verbose || echo "Example validation skipped (markdown format)"
  allow_failure: true
  only:
    - merge_requests
    - main
