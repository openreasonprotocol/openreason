# GitLab CI/CD Pipeline for OpenReason Protocol

# Default image for all jobs
image: python:3.11

# Cache pip packages between jobs
cache:
  paths:
    - .cache/pip
    - .venv/

# Define stages
stages:
  - lint
  - test
  - build
  - release

# Before script for all jobs - set up virtual environment
before_script:
  - python --version
  - pip install --upgrade pip
  - python -m venv .venv
  - source .venv/bin/activate
  - pip install -e ".[dev]"

# Code quality checks
lint:black:
  stage: lint
  script:
    - black --check orp_validator/ tests/
  only:
    - merge_requests
    - main

lint:ruff:
  stage: lint
  script:
    - ruff check orp_validator/ tests/
  only:
    - merge_requests
    - main

lint:mypy:
  stage: lint
  script:
    - mypy orp_validator/
  only:
    - merge_requests
    - main

# Test jobs
test:unit:
  stage: test
  script:
    - pytest tests/ -v --cov=orp_validator --cov-report=term --cov-report=xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  only:
    - merge_requests
    - main

# Test on multiple Python versions
test:python3.9:
  stage: test
  image: python:3.9
  script:
    - pytest tests/ -v
  only:
    - merge_requests
    - main

test:python3.10:
  stage: test
  image: python:3.10
  script:
    - pytest tests/ -v
  only:
    - merge_requests
    - main

test:python3.11:
  stage: test
  image: python:3.11
  script:
    - pytest tests/ -v
  only:
    - merge_requests
    - main

test:python3.12:
  stage: test
  image: python:3.12
  script:
    - pytest tests/ -v
  only:
    - merge_requests
    - main

# Build package
build:package:
  stage: build
  script:
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
    - tags

# Validate ORP documents in the repository
validate:examples:
  stage: test
  script:
    - orp validate examples/danish_property_tax_reform.yaml --verbose
    - orp validate examples/data_product_ctv_segment.v0.3.yaml --profile ORP-Ads
  only:
    - merge_requests
    - main

# ORP v0.3 conformance suite (RFC §9.2): schema + usage-policy + lineage fixtures must all pass.
conformance:v0.3:
  stage: test
  script:
    - orp conform
  only:
    - merge_requests
    - main

# API Tests
test:api:
  stage: test
  before_script:
    - cd api
    - python --version
    - pip install --upgrade pip
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -r requirements.txt
  script:
    - pytest tests/ -v --cov=. --cov-report=term --cov-report=xml --cov-fail-under=80
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: api/coverage.xml
    paths:
      - api/htmlcov/
    expire_in: 1 week
  only:
    - merge_requests
    - main

# PyPI Release (only on tags)
# Requires PYPI_TOKEN variable set in GitLab CI/CD settings
release:pypi:
  stage: release
  script:
    - pip install twine
    - python -m build
    - |
      cat > ~/.pypirc <<EOF
      [distutils]
      index-servers = pypi

      [pypi]
      repository = https://upload.pypi.org/legacy/
      username = __token__
      password = $PYPI_TOKEN
      EOF
    - chmod 600 ~/.pypirc
    - twine upload dist/*
  only:
    - tags
  when: manual  # Require manual trigger for safety
  environment:
    name: production
    url: https://pypi.org/project/orp-validator/

# Create GitLab Release
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:package
      artifacts: true
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: |
      Release $CI_COMMIT_TAG of orp-validator

      See CHANGELOG.md for details.

      Install: pip install orp-validator==$CI_COMMIT_TAG
  only:
    - tags
