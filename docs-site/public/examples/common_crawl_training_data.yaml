        - "Privacy concerns: Personal data scraped from web without notification or consent"
      net_welfare: "positive for English speakers, mixed/negative for low-resource language speakers"
      notes: |
        DIFFERENTIAL HARM: 1 billion English speakers benefit strongly (SOTA tools, productivity gains). 4-5 billion
