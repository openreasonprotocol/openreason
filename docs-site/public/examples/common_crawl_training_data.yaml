        - $10-50M/year: Proactive digitization (fund Wikipedia, news, literature in 1,000+ languages)
        - $50-500M/year: Comprehensive (fund + micropayments to publishers for consent-based crawl)

    - id: "ai_training_adoption_rate"
      name: "Percentage of LLMs Using Common Crawl"
      description: |
