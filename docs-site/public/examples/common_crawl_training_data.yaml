        - Who made final decision (founder? board? consensus? default by omission?)

        This is EXACTLY why ORP exists: Layer 4 would REQUIRE constitutive decisions be logged BEFORE deployment.
      consequences:
        - "90%+ English/WEIRD language representation (2008-2024, 15 years)"
        - "<0.1% representation for 6,900+ low-resource languages"
        - "ALL major LLMs (GPT-3, GPT-4, LLaMA, Claude, Gemini) trained on English-dominant data"
