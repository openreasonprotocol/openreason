        - "Ethical scrutiny: 'Stochastic Parrots' (Bender et al. 2021) highlights harms of large datasets"
        - "Reputation risk: Association with LAION-5B CSAM distribution"
      net_welfare: "strongly positive"
      notes: |
        Benefits vastly outweigh harms for this group. Many AI researchers on Common Crawl advisory board (high
        representation). Benefit from free data worth tens of millions, minimal personal harm (criticism is
        professional, not material).

    - id: "ai_companies"
      name: "AI Companies (Secondary Beneficiaries)"
      description: |
        100+ companies building LLMs and AI products using Common Crawl training data. Includes OpenAI ($80B valuation),
        Anthropic ($18B), Google (Gemini), Meta (LLaMA), Stability AI ($1B), 100+ startups.
      representation_in_decision_making: "high"
      population_size: "100+ companies, 100,000+ employees"
      stakeholder_power: "very high"
      benefits:
