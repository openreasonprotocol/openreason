l3_empathy_mapping:

  stakeholder_groups:

    - id: "common_crawl_foundation"
      name: "Common Crawl Foundation (Governance Node)"
      description: |
        Non-profit organization (501(c)(3) since 2011) that operates Common Crawl. Board of directors (5-10 members),
        engineering team (5-10 staff), funded by corporate sponsors (Amazon Web Services, foundations).
      representation_in_decision_making: "100%"
      population_size: "15-20 people (board + staff)"
      stakeholder_power: "complete"
      benefits:
        - "Mission fulfillment: Open web archive preserved for posterity"
        - "Technical reputation: Cited in 10,000+ AI research papers"
        - "Industry goodwill: Enables $100B+ AI company valuations"
        - "Funding secured: AWS sponsorship, foundation grants"
      harms:
        - "Minimal direct harm (criticisms of linguistic bias, but organization survives)"
        - "Reputational risk from LAION-5B CSAM inheritance (Common Crawl enabled downstream Tier 1 harm)"
      net_welfare: "positive"
      notes: |
        Only stakeholder group with 100% governance power. All constitutive decisions (universal crawl, no linguistic
        targets, no CSAM filtering, no consent mechanism) made by this group of 15-20 people affecting 8 billion.

    - id: "ai_researchers"
      name: "AI Researchers (Primary Beneficiaries)"
      description: |
        10,000+ academic and industry researchers using Common Crawl for LLM training, NLP research, web mining studies.
