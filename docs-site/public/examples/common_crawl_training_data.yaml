        - "Regulatory risk: EU AI Act, US COPPA enforcement (CSAM in training data)"
        - "Reputation damage: Bias, safety failures, linguistic exclusion criticism"
      net_welfare: "strongly positive"
      notes: |
        Benefits ($100B+ valuations) dwarf harms ($1-10B lawsuit risk). Companies sponsor Common Crawl (AWS provides
        free S3 hosting). High representation in governance (advisory board seats, funding influence).

        CRITICAL: Companies capture 99%+ of economic value created by Common Crawl ($100B valuations) while Common
        Crawl budget is $5-10M/year (0.01% of value created). Massive wealth transfer from linguistic communities
        (whose data/labor scraped) to Western AI companies.

    - id: "llm_users"
      name: "LLM Users (Indirect Beneficiaries)"
      description: |
        1 billion+ people using ChatGPT, Claude, Gemini, Copilot, and other LLMs trained on Common Crawl data.
        Includes professionals (coding, writing, research), students, general consumers.
      representation_in_decision_making: "zero"
      population_size: "1 billion+"
      stakeholder_power: "none"
      benefits:
        - "Access to AI tools: ChatGPT, Claude, Gemini for productivity, learning, creativity"
