        Zero representation in Common Crawl governance despite being largest affected population.

    - id: "low_resource_language_communities"
      name: "Low-Resource Language Communities (ABSENT NODE, TIER 1 EXISTENTIAL HARM)"
      description: |
        6,900+ linguistic communities whose languages have <0.1% Common Crawl representation each. Includes:
        - 2,000+ African languages (Yoruba, Igbo, Zulu, Amharic, etc.)
        - 3,000+ Asian/Pacific languages (Hmong, Karen, Tok Pisin, etc.)
        - 1,000+ indigenous languages (Navajo, Quechua, Maori, Sami, etc.)
        - 900+ endangered languages (UNESCO classification: critically endangered to vulnerable)

        Population: 4-5 billion people whose native languages have <1% Common Crawl representation.
      representation_in_decision_making: "zero"
      population_size: "4-5 billion people, 6,900+ languages"
      stakeholder_power: "none"
      benefits:
        - "NONE - zero representation in Common Crawl means zero NLP tools in native languages"
      harms:
        - "TIER 1 EXISTENTIAL: Digital extinction accelerates language death (Kornai 2013)"
        - "Economic exclusion: Must learn English to access AI productivity tools (GitHub Copilot, ChatGPT)"
        - "Educational harm: AI tutors, learning tools English-only (children forced to learn in second language)"
        - "Cultural erasure: Oral traditions, indigenous knowledge NOT in AI training corpus"
        - "Intergenerational injustice: Future generations inherit AI that speaks only dead/dominant languages"
        - "Dignity harm: Languages treated as 'not worth including' (implicit message: your culture doesn't matter)"
      net_welfare: "strongly negative"
      harm_severity: "TIER 1 - EXISTENTIAL (language extinction is IRREVERSIBLE)"
      vulnerable_population_flags:
        - "IRREVERSIBLE HARM: Once last fluent speaker dies, language cannot be reconstructed"
        - "INTERGENERATIONAL: Children born 2025-2100 inherit world where 50-90% of languages extinct"
        - "CULTURAL GENOCIDE: Oral traditions, indigenous worldviews erased from AI memory"
      notes: |
        CRITICAL ABSENT NODE: Largest harmed population (4-5 billion people), zero governance representation.

        MINORITY STRESS TEST: FAILED
        - Most vulnerable population (endangered languages, indigenous communities, Global South)
        - Bears highest-tier harm (existential - language extinction)
        - For benefit of most privileged population (Western AI companies, English speakers)
        - Violates Rawlsian justice: Worst-off harmed for others' benefit

        ORP'S VALUE: Layer 3 empathy mapping in 2008 would have identified this absent node BEFORE 15 years of
        linguistic hegemony. Minority stress test would trigger: "If worst-off bear TIER 1 irreversible harm,
        reconsider constitutive decision."

    - id: "future_generations"
      name: "Future Generations (Unrepresented, Intergenerational Harm)"
      description: |
        Billions of children who will be born 2025-2100 and grow up in world where:
        - LLMs are primary information access (like Google for Gen Z, but more pervasive)
        - 50-90% of world's languages extinct (Krauss 1992 projection + AI acceleration)
        - AI trained on corpus where 6,900+ languages never existed (Common Crawl 2008-2024 snapshots)
      representation_in_decision_making: "zero"
      population_size: "10+ billion (projected births 2025-2100)"
      stakeholder_power: "none"
      benefits:
        - "Access to AI tools (if linguistic diversity preserved, multilingual LLMs)"
        - "Potential: If S2/S3 implemented, 3,000-4,000 languages preserved vs extinct"
      harms:
        - "TIER 1 EXISTENTIAL: Inherit world where 50-90% of human linguistic diversity extinct"
        - "Cultural poverty: AI teaches from 10-20 Western languages vs 7,000 diverse perspectives"
        - "Irreversible loss: Cannot undo language extinction (grandparents' languages dead)"
        - "Economic lock-in: English-dominant AI creates path dependency (switching costs high)"
      net_welfare: "strongly negative if S1 (actual), strongly positive if S2-S4"
      notes: |
        INTERGENERATIONAL INJUSTICE: Current generation (Common Crawl 2008-2024) made constitutive decisions
        (universal crawl, no linguistic targets) that determine linguistic landscape for next century.

        Future generations had ZERO voice in decisions that will shape their reality. Cannot vote, cannot protest,
        cannot fork (by the time they're adults, languages already extinct).

        This is EXACTLY the harm pattern climate change critics identify: Current generation benefits (cheap fossil
        fuels / free AI training data), future generations pay costs (climate catastrophe / linguistic extinction).

    - id: "linguistic_researchers"
      name: "Linguistic Researchers and Preservationists (Critics, Low Power)"
      description: |
        1,000+ computational linguists, endangered language researchers, UNESCO linguistic diversity advocates,
        SIL International field workers studying and documenting low-resource languages.
      representation_in_decision_making: "low"
      population_size: "1,000-5,000 researchers"
      stakeholder_power: "low"
      benefits:
        - "Research data: Common Crawl useful for studying web linguistic distribution"
        - "Problem identification: Studies like Joshi 2020, Kreutzer 2022 document bias using Common Crawl"
      harms:
        - "Professional frustration: Document problems but unable to change Common Crawl policy"
        - "Funding competition: $5-10M/year Common Crawl budget could fund 50-100 language preservation projects"
        - "Mission failure: Languages go extinct despite decades of documentation efforts (AI accelerates loss)"
      net_welfare: "negative"
      notes: |
        CRITICS WITH NO POWER: Linguistic researchers publish studies documenting Common Crawl's bias (Joshi 2020,
        Kreutzer 2022, Bender 2021 'Stochastic Parrots'), but have zero Common Crawl governance influence.

        Common Crawl has NOT responded to linguistic diversity criticism with policy changes (2008-2024, 15 years).
        Studies cited in academic papers but ignored in operations.

        This is governance failure: Critics can document harms but not prevent them.

    - id: "web_publishers"
      name: "Web Publishers and Content Creators (Exploited Labor)"
      description: |
        Millions of websites, bloggers, journalists, photographers, writers whose content scraped by Common Crawl
        and used for AI training without notification or compensation.
      representation_in_decision_making: "minimal"
      population_size: "100+ million websites, 1+ billion content creators"
      stakeholder_power: "low"
      benefits:
        - "SEO visibility: Crawling may boost search rankings (debatable)"
        - "Archival: Content preserved in web archive for posterity"
      harms:
        - "Zero compensation: Content creates $100B+ AI valuations, publishers get $0"
        - "Copyright violation: Training LLMs on copyrighted content contested (lawsuits pending)"
        - "No consent: Robots.txt predates AI training use case (1994 vs 2018)"
        - "Journalism sustainability crisis: News publishers not paid despite content used for AI training"
      net_welfare: "negative"
      notes: |
        LABOR EXPLOITATION PATTERN: Publishers create content → Common Crawl scrapes for free → AI companies
        train models → $100B valuations → publishers get $0.

        New York Times lawsuit (2023): "OpenAI used decades of our journalism without permission or payment."
        Common Crawl's response: "We're just an archive, not responsible for downstream use."

        Robots.txt opt-out insufficient: Created 1994 for search indexing, no AI-specific directive. Many publishers
        unaware content used for training until 2020-2023 lawsuits.

    - id: "copyright_holders"
      name: "Copyright Holders (Legal Opposition)"
      description: |
        Authors, artists, photographers, news organizations whose copyrighted works scraped by Common Crawl and
        used for AI training. Includes New York Times, Getty Images, individual authors (Andersen v. Stability AI).
      representation_in_decision_making: "zero"
      population_size: "Millions of copyright holders"
      stakeholder_power: "medium"
      benefits:
        - "None directly (unless courts rule AI training requires licensing)"
      harms:
        - "Copyright infringement: $1-10B in lawsuit damages (pending cases)"
        - "Market harm: AI-generated content competes with human creators (Getty vs Stability AI)"
        - "Attribution failure: LLM outputs don't credit sources (violates some licenses)"
      net_welfare: "negative"
      notes: |
        LEGAL BATTLEGROUND: Copyright law unsettled on whether AI training is "fair use" (US) or permitted under
        EU Copyright Directive. Multiple lawsuits pending 2023-2025.

        If courts rule training is NOT fair use, Common Crawl's distribution of copyrighted content for AI training
        creates massive liability ($1-10B settlements, potential criminal charges).

        Common Crawl's disclaimer ("we don't claim copyright, users must respect originals") may be insufficient
        shield - enabling unauthorized use still creates liability.

    - id: "non_western_web_users"
      name: "Non-Western Web Users Generally (Underrepresented)"
      description: |
        5+ billion internet users outside WEIRD countries (Western, Educated, Industrialized, Rich, Democratic).
        Includes users in China, India, Africa, Southeast Asia, Latin America, Middle East.
      representation_in_decision_making: "minimal"
      population_size: "5+ billion (80% of world population)"
      stakeholder_power: "low"
      benefits:
        - "Some LLM access: Major languages (Chinese, Hindi, Arabic) have partial Common Crawl representation"
        - "Better than nothing: 10-40% degraded performance vs no tools at all"
      harms:
        - "Performance degradation: LLMs 20-60% worse for non-English languages (vs English SOTA)"
        - "Cultural bias: Western-centric responses even when answering in non-English languages"
        - "Machine translation bottleneck: Must translate to/from English for best results"
        - "Economic disadvantage: English speakers capture disproportionate AI productivity gains"
      net_welfare: "mixed to negative"
      notes: |
        80% OF WORLD POPULATION underrepresented in Common Crawl (10-30% representation vs 70%+ for WEIRD).

        Chinese (1.3 billion speakers, 18% world population) gets 3-15% Common Crawl representation.
        Hindi (600 million speakers, 8% world) gets 0.57% representation.

        Pattern: Population INversely correlated with representation. More speakers = less per-capita data.

  minority_stress_test:
    description: |
      RAWLSIAN JUSTICE TEST: Are the worst-off stakeholders made better off, or at least not worse off, by
      Common Crawl's constitutive decisions?

      WORST-OFF STAKEHOLDERS:
      1. Low-resource language communities (6,900+ languages, 4-5 billion people)
      2. Future generations (10+ billion children born 2025-2100)
      3. Endangered language speakers (900+ critically endangered languages, 50-500M people)

      HARMS TO WORST-OFF:
      - TIER 1 EXISTENTIAL: Language extinction accelerated (digital death precedes physical death)
      - IRREVERSIBLE: Once last speaker dies, language cannot be reconstructed from Common Crawl (never there)
      - INTERGENERATIONAL: Future generations inherit linguistic poverty (50-90% diversity lost)

      BENEFITS TO BEST-OFF:
      1. AI companies (100+): $100B+ valuations from FREE training data
      2. English speakers (1.5 billion): SOTA AI tools, productivity gains, economic advantage
      3. Western researchers (10,000+): Free data, career advancement, 2,000+ papers published

      DISTRIBUTIONAL JUSTICE ANALYSIS:
      - Worst-off (4-5 billion low-resource language speakers) bear HIGHEST harm (Tier 1 existential)
      - Best-off (Western AI companies, English speakers) capture 99%+ of benefits ($100B+ valuations)
      - No compensation mechanism (publishers/communities get $0 despite content scraped)
      - No voice mechanism (6,900+ linguistic communities, zero governance representation)

      RAWLSIAN TEST RESULT: **FAILED**

      Common Crawl's constitutive decisions (universal crawl, no linguistic targets, no compensation) make
      worst-off stakeholders WORSE OFF (accelerate language extinction) for benefit of best-off stakeholders
      (Western AI industry profits).

      This is textbook distributional injustice: Privileged minority captures benefits, vulnerable majority bears harms.

    result: "failed"
    vulnerable_populations_identified:
      - "Low-resource language communities (6,900+ languages, 4-5 billion people)"
      - "Endangered language speakers (900+ critically endangered languages)"
      - "Future generations (10+ billion children, intergenerational harm)"
      - "Indigenous communities (1,000+ languages, oral traditions excluded)"
      - "Children in low-resource language communities (educational harm, forced English)"
    highest_severity_harm: "TIER 1 - EXISTENTIAL (language extinction, irreversible)"
    notes: |
      CRITICAL FAILURE PATTERN:

      1. ABSENT NODE: Largest harmed population (4-5 billion) has zero governance representation
      2. TIER 1 HARM: Existential (language extinction) not tradeable against economic benefits (AI valuations)
      3. IRREVERSIBILITY: Unlike LAION-5B (removed 2,236 CSAM URLs post-hoc), extinction cannot be undone
      4. VICIOUS CYCLE: Digital absence → no NLP tools → economic pressure → language switching → extinction → even less data
      5. INTERGENERATIONAL: Current generation's decisions determine linguistic landscape for next century

      IF COMMON CRAWL HAD CONDUCTED LAYER 3 IN 2008:
      - Minority stress test would identify low-resource communities as vulnerable population
      - Tier 1 existential harm would trigger policy reconsideration
      - Cost-benefit analysis: $1-5M/year prevents harm to 2-3 billion people
      - Decision: Linguistic diversity targets ethically required (Rawlsian justice)

      RESULT: 15 years of linguistic hegemony avoided, 3,000+ languages preserved.

  net_welfare_assessment:
    utilitarian_analysis:
      total_benefits: |
        QUANTIFIABLE BENEFITS:
        - AI companies: $100B+ in valuations
        - AI researchers: 2,000+ papers, career advancement, $10-100M saved on crawl infrastructure
        - LLM users (English speakers): 1 billion × $100-1,000/year productivity gains = $100B-1T annual

        TOTAL: $200B-1T+ in economic value created (2018-2024, 6 years)

      total_harms: |
        QUANTIFIABLE HARMS:
        - Low-resource language communities: 4-5 billion people × $100-1,000/year productivity loss = $400B-5T annual
        - Language extinction: 5,635 languages × $500K/language (UNESCO preservation cost) = $2.8B
        - Copyright lawsuits: $1-10B in settlements
        - Publisher revenue loss: $1-10B/year (journalism sustainability crisis)

        TOTAL: $400B-5T+ in economic harm + irreversible cultural loss

      net_utilitarian_welfare: "NEGATIVE if harms to 4-5 billion people counted; POSITIVE if only English speakers counted"

      critique_of_utilitarian_approach: |
        UTILITARIAN ANALYSIS INADEQUATE:

        1. TIER 1 HARMS NOT TRADEABLE: Language extinction (irreversible, existential) cannot be offset by
           economic benefits (AI company profits). Kornai (2013): "Digital language death is nearly inevitable
           once last fluent speakers die... no amount of money can reconstruct extinct language."

        2. INCOMMENSURABILITY: Cultural heritage (7,000 languages, oral traditions, indigenous worldviews) not
           measurable in dollars. Trying to put price on Navajo language's existence is category error.

        3. DISCOUNTING FUTURE GENERATIONS: Utilitarian calculation favors present benefits (AI profits 2018-2024)
           over future harms (language extinction 2025-2100). But future generations' welfare should count equally.

        4. DISTRIBUTION IGNORED: Utilitarian sum may be positive ($1T benefits - $500B harms = $500B net) but
           if benefits go to 1 billion privileged, harms to 5 billion vulnerable, this is unjust distribution.

    deontological_analysis:
      kantian_dignity: |
        KANTIAN TEST: Are low-resource language communities treated as ENDS in themselves, or as MEANS to AI
        industry's ends?

        ANALYSIS:
        - Common Crawl scrapes content from linguistic communities without notification, consent, or compensation
        - Content used to train LLMs that benefit Western AI companies ($100B+ valuations)
        - Communities get zero benefit (no NLP tools in their languages, no compensation, no governance voice)
        - Communities' languages/cultures used as RAW MATERIAL for others' profit

        KANTIAN VERDICT: **VIOLATED**

        Low-resource language communities treated as MEANS (data sources) to AI industry's ENDS (profits), not as
        ENDS in themselves (autonomous agents deserving respect, consent, compensation).

        Kant's Categorical Imperative: "Act in such a way that you treat humanity, whether in your own person or
        in the person of any other, never merely as a means to an end, but always at the same time as an end."

        Common Crawl's universal crawl treats billions of people as DATA SOURCES, not as stakeholders deserving
        voice in decisions affecting their linguistic futures.

      rawlsian_justice: |
        RAWLSIAN TEST (Original Position): Would rational agents behind veil of ignorance (not knowing which
        language community they'll be born into) agree to Common Crawl's constitutive decisions?

        ANALYSIS:
        - Probability of being born into low-resource language community: 80% (4-5 billion of 6 billion)
        - Probability of being born into English-speaking community: 20% (1 billion of 6 billion)

        Behind veil of ignorance, 80% chance you'll be harmed (language extinction, economic exclusion) for
        20%'s benefit (AI tools, productivity gains).

        Rational agent would demand linguistic diversity targets (S2) or radical equity (S3) to protect against
        80% risk of being born into harmed community.

        RAWLSIAN VERDICT: **VIOLATED**

        No rational agent would agree to universal crawl (S1) behind veil of ignorance. S2 (targeted diversity)
        is minimum acceptable (reduces harm to 49% of languages vs 80%). S3 (radical equity) is preferable
        (reduces harm to 21% of languages).

      rights_based_analysis: |
        RIGHTS POTENTIALLY VIOLATED:

        1. CULTURAL RIGHTS (UN Declaration on Rights of Indigenous Peoples, Article 13):
           "Indigenous peoples have the right to revitalize, use, develop and transmit to future generations their
           histories, languages, oral traditions, philosophies, writing systems and literatures."

           Common Crawl's digital exclusion of indigenous languages (1,000+ languages, <0.1% representation each)
           VIOLATES right to transmit languages to future generations (AI trained on corpus where languages don't exist).

        2. LINGUISTIC RIGHTS (UNESCO Universal Declaration on Cultural Diversity, Article 5):
           "All persons should be able to express themselves and to create and disseminate their work in the language
           of their choice... particularly through mother tongue schooling."

           Common Crawl's English dominance creates economic pressure to abandon mother tongues for English (to access
           AI tools), VIOLATING linguistic rights.

        3. RIGHT TO INFORMED CONSENT (GDPR Article 6, though Common Crawl pre-dates GDPR):
           Web publishers not informed content would be used for AI training (robots.txt predates AI use case).

        4. INTERGENERATIONAL EQUITY (Rio Declaration, Principle 3):
           "The right to development must be fulfilled so as to equitably meet developmental and environmental needs
           of present and future generations."

           Common Crawl's decisions (2008-2024) sacrifice future generations' linguistic diversity for present
           generation's AI development, VIOLATING intergenerational equity.

    recommended_framework: |
      UTILITARIANISM INSUFFICIENT for evaluating Common Crawl's constitutive decisions because:
      - Tier 1 existential harms (language extinction) not tradeable against economic benefits
      - Incommensurable values (cultural heritage vs AI profits)
      - Distributional injustice (privileged benefit, vulnerable harmed)

      DEONTOLOGY REQUIRED:
      - Kantian dignity: Treat linguistic communities as ENDS, not MEANS (require consent, compensation, voice)
      - Rawlsian justice: Behind veil of ignorance, protect worst-off from irreversible harms
      - Rights-based: Cultural rights, linguistic rights, intergenerational equity all violated by S1 (actual)

      RECOMMENDED INTERVENTION:
      S2 (Targeted Linguistic Diversity) is MINIMUM ethically required:
      - Cost: $60M over 15 years (+50% budget)
      - Benefit: 3,185 languages saved (57% reduction in extinction)
      - Rawlsian: Reduces harm to 49% of languages (vs 80% in S1)
      - Kantian: Treats linguistic communities as stakeholders deserving voice (partnerships with UNESCO, SIL)
      - Rights: Partially protects cultural/linguistic rights (100+ major languages preserved)

      S3 (Radical Equity) is IDEAL:
      - Cost: $570M over 15 years (5x budget, but 0.6% of AI value created)
      - Benefit: 4,165 languages saved (74% reduction in extinction)
      - Rawlsian: Reduces harm to 21% of languages (vs 80% in S1)
      - Kantian: Proactive digitization treats linguistic communities as partners (funding, voice, compensation)
      - Rights: Strongly protects cultural/linguistic/intergenerational rights (1,000+ languages preserved)

  notes: |
    LAYER 3 KEY FINDINGS:

    1. ABSENT NODE PATTERN: Largest harmed population (4-5 billion low-resource language speakers) has ZERO
       governance representation in Common Crawl. Decisions made by 15-20 people affecting 8 billion.

    2. MINORITY STRESS TEST FAILED: Worst-off stakeholders (vulnerable populations: endangered languages,
       indigenous communities, future generations) bear HIGHEST harm (Tier 1 existential) for benefit of
       best-off stakeholders (Western AI companies, English speakers).

    3. TIER 1 EXISTENTIAL HARM: Language extinction is IRREVERSIBLE (unlike LAION-5B CSAM remediation).
       Once last speaker dies, no amount of money or AI can reconstruct language from Common Crawl (never there).

    4. DEONTOLOGICAL FAILURE: Kantian dignity violated (communities treated as MEANS not ENDS), Rawlsian
       justice violated (worst-off harmed for others' benefit), rights violated (cultural, linguistic,
       intergenerational).

    5. UTILITARIAN ANALYSIS INADEQUATE: Tier 1 harms not tradeable against economic benefits, incommensurable
       values (cultural heritage vs profits), distributional injustice ignored.

    6. ORP'S COUNTERFACTUAL VALUE: If Common Crawl conducted Layer 3 empathy mapping in 2008, minority stress
       test would TRIGGER policy reconsideration. Cost-benefit: $1-5M/year prevents Tier 1 harm to 2-3 billion
       people. Ethical conclusion: Linguistic diversity targets REQUIRED (Rawlsian justice, Kantian dignity).

       RESULT: 15 years of linguistic hegemony avoided, 3,000+ languages preserved, billions benefit from
       multilingual AI tools.

