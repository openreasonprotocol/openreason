orp_version: "0.2"
post_hoc: true
extensions:
  - orp-ai-training-v1
document_id: "common-crawl-training-data-2026"
title: "Common Crawl Training Data - Constitutive Decisions and Linguistic Extinction"
domain: ai-training
authors:
  - name: "Asbjørn Ras"
    role: author
created: "2026-04-07"
last_modified: "2026-04-07"
status: draft
summary: |
  Post-hoc reconstruction of Common Crawl (2008-2024), the largest open web crawl dataset used to train
  GPT-3, GPT-4, LLaMA, Claude, Gemini, and virtually all large language models. Seven constitutive decisions
  (2008-2024) made without transparent linguistic diversity analysis resulted in 90%+ English/WEIRD content,
  accelerating digital extinction of 6,900+ low-resource languages. This represents TIER 1 EXISTENTIAL HARM:
  50-90% of world's 7,000 languages may be extinct by 2100, and AI trained on Common Crawl learns a world
  where these languages never existed. Affects 4-5 billion people whose languages have <0.1% representation
  each. Alternatives: $1-5M/year (20-50% budget increase) for targeted linguistic diversity could preserve
  100+ major languages; $10-50M/year could protect 1,000+ languages from digital extinction. Decisions made
  for UNKNOWN reasons (cost? ideology? technical complexity?) - completely undocumented. ORP's value: If
  Common Crawl had conducted Layer 3 empathy mapping in 2008, minority stress test would have identified
  low-resource language communities as vulnerable population bearing Tier 1 irreversible harm, triggering
  linguistic diversity targets preventing 15 years of English-dominant AI training data.

# ============================================================================
# LAYER 1: DATA PROVENANCE
# ============================================================================

l1_data_provenance:

  - dataset_id: "common-crawl-2008-2024"
    name: "Common Crawl Open Repository"

    description: |
      Common Crawl is an open repository of web crawl data, providing monthly snapshots of billions of web
      pages since 2008. As of 2024, contains 250+ billion web pages totaling 3+ petabytes of compressed data
      across 180+ monthly snapshots. Common Crawl is a LIVING DATASET with continuous evolution (monthly
      releases), distinguishing it from static datasets like ImageNet (2009) or LAION-5B (March 2022).

      CRITICAL CONTEXT: Common Crawl is the PRIMARY training data source for virtually all large language
      models (LLMs) developed 2018-2024:
      - GPT-3 (OpenAI 2020): 410 billion tokens (60% of training data)
      - GPT-4 (OpenAI 2023): Likely source (not officially confirmed)
      - LLaMA (Meta 2023): 1.4 trillion tokens (67% of training data)
      - Claude (Anthropic 2024): Confirmed major source
      - Gemini (Google 2023): Confirmed source
      - PaLM, BLOOM, Galactica, and 100+ other LLMs

      Result: Common Crawl's linguistic distribution (90%+ English/WEIRD languages) is BAKED INTO the
      foundational AI infrastructure of 2020s. Not just one model's bias - SYSTEMIC bias across entire
      AI ecosystem.

      HARM PATTERN: CONSTITUTIVE OPACITY (2008) → 15 YEARS OF LINGUISTIC HEGEMONY (2008-2024) →
      IRREVERSIBLE EXTINCTION (2025-2100). Unlike LAION-5B where post-hoc remediation removed 2,236 CSAM
      URLs, language extinction CANNOT be remediated post-hoc. Once last fluent speaker dies, no amount
      of money or AI can reconstruct language from Common Crawl (it was never there).

    source: "World Wide Web (universal crawl, no geographic or linguistic targeting)"

    dataset_type: "living"

    temporal_metadata:
      first_snapshot: "2008-09"
      latest_snapshot: "2024-03"
      total_snapshots: 180
      cadence: "monthly"
      snapshot_ids_used_by_llms:
        - model: "GPT-3"
          snapshots: "2016-01 through 2019-12"
          tokens: "410 billion"
        - model: "LLaMA"
          snapshots: "2017-01 through 2020-12"
          tokens: "1.4 trillion"
        - model: "Claude"
          snapshots: "Not disclosed"
          tokens: "Not disclosed"
      evolution_summary: |
        Common Crawl methodology has evolved over 15 years:
        - 2008-2021: Used Alexa Top 1M as seed URLs (75%+ English websites)
        - 2021-present: Internal URL database (linguistic distribution similar)
        - 2013: Deduplication added (within snapshot)
        - 2016: WARC format standardized
        - 2018: Adult content filtering added (minimal, pornography only)
        - 2024: No CSAM filtering, no linguistic diversity targets, no consent mechanism

        CRITICAL: Despite 15 years of evolution, ZERO changes to address linguistic diversity or
        consent for AI training. Decision D1 (universal crawl, no linguistic targets) made in 2008
        and never revisited despite AI training becoming primary use case by 2018.

    methodology_changes:
      - date: "2008-09"
        change: "Initial crawl methodology established - universal crawl of web"
        rationale: "Reflect the web as it is, not as we think it should be"
        impact: "Encoded existing linguistic hegemony (90%+ English Alexa Top 1M) into dataset"

      - date: "2013-06"
        change: "Added deduplication within snapshots"
        rationale: "Reduce storage costs, improve data quality"
        impact: "Minimal effect on linguistic distribution"

      - date: "2018-03"
        change: "Adult content filtering added (pornography classifier)"
        rationale: "Make dataset more accessible to researchers, avoid legal issues"
        impact: |
          Removed hardcore pornography but NOT CSAM (no age detection), NOT medical privacy violations,
          NOT revenge porn (no consent detection). Inherited by LAION-5B, resulting in 3,226 CSAM URLs.

      - date: "2021-04"
        change: "Seed URL source changed from Alexa Top 1M to internal database"
        rationale: "Alexa discontinued service; needed alternative seed source"
        impact: |
          Linguistic distribution largely unchanged (internal database similarly English-dominant).
          MISSED OPPORTUNITY: Could have used this transition to implement linguistic diversity targets,
          but decision not documented or debated publicly.

    collection_method: |
      CRAWL METHODOLOGY (As of 2024):

      1. SEED SELECTION:
         - Source: Internal URL database (post-2021) built from previous crawls and submissions
         - Pre-2021: Alexa Top 1M websites (75%+ English, Western-hosted)
         - Problem: Seed bias determines crawl bias. If seeds are English-dominant, crawl will be.
         - No linguistic diversity targets: No minimum representation thresholds for any language

      2. CRAWL EXECUTION:
         - Crawl depth: 1 hop from seed URLs (follow links one level deep)
         - Respect robots.txt: Honor opt-out requests (but robots.txt predates AI training use case by 15 years)
         - Monthly cadence: 3-5 billion pages per monthly snapshot
         - Geographic: No targeting (crawls wherever seeds lead, predominantly US/EU hosting)

      3. FILTERING:
         - Adult content: Pornography classifier (does NOT detect CSAM, medical nudity, or NCII)
         - Duplicate detection: Within-snapshot deduplication (fuzzy matching)
         - Language identification: Detects language but does NOT filter or balance by language
         - Quality thresholds: Universal (NOT language-specific - see Kreutzer et al. 2022 problem)

      4. DISTRIBUTION:
         - Format: WARC (Web ARChive) files, gzipped
         - Storage: Amazon S3 buckets (publicly accessible, no authentication)
         - Cost: Free to download (AWS egress fees apply)
         - License: "We do not claim copyright; respect original websites' copyrights"

      CRITICAL LIMITATION: Provenance documentation is STATISTICAL, not exhaustive. With 250 billion pages,
      complete provenance impossible. ORP v0.2 needs "scale-appropriate provenance" category allowing
      representative sampling (e.g., "1,000 pages per language audited for quality").

    date_range:
      start: "2008-09"
      end: "2024-03"
      temporal_scope: "15 years, 7 months"

    geographic_scope: |
      GLOBAL (in theory) - worldwide web crawl

      WESTERN-DOMINATED (in practice):
      - 70%+ content hosted in US/EU data centers
      - 90%+ content in English, Russian, German, French, Japanese (WEIRD languages)
      - <10% content from Global South (Africa, South Asia, Southeast Asia, Pacific Islands)
      - <0.1% content in low-resource languages (6,900+ languages)

      LINGUISTIC DISTRIBUTION (Joshi et al. 2020, Common Crawl 2019 snapshot):
      - English: 46.47%
      - Russian: 5.64%
      - German: 4.92%
      - French: 4.32%
      - Japanese: 4.26%
      - Spanish: 3.85%
      - Chinese: 3.01% (despite 1.3 billion speakers - 18% of world population)
      - Arabic: 1.20% (despite 400 million speakers)
      - Hindi: 0.57% (despite 600 million speakers)
      - Swahili: 0.02% (100 million speakers)
      - Yoruba: 0.005% (45 million speakers)
      - Igbo: <0.001% (30 million speakers)
      - 6,000+ languages: 0.000% each (no digital presence in Common Crawl)

      PATTERN: Language representation INVERSELY correlated with population speaking it. English
      (1.5 billion speakers, 20% world) gets 46% representation. Chinese (1.3 billion, 18% world)
      gets 3% representation. Hindi (600 million, 8% world) gets 0.57%.

      MECHANISM: Digital divide - wealthy (WEIRD) countries produce more web content per capita.
      Result: Common Crawl is not "neutral mirror of web" but amplifier of existing inequalities.

    inclusion_criteria:
      description: |
        UNIVERSAL INCLUSION (in theory):
        - Any publicly accessible URL on the World Wide Web
        - Respects robots.txt opt-out
        - No paywalls, no authentication-required content

        BIASED INCLUSION (in practice):
        - Seed URL bias: Alexa Top 1M (2008-2021) was 75%+ English websites
        - Crawl depth bias: 1 hop from seeds means English-linked-to-English
        - Geographic bias: Web hosting concentrated in US/EU
        - Economic bias: Wealthy countries produce more web content per capita
        - Linguistic bias: English-dominant web (legacy of US creating internet infrastructure)

        RESULT: "Universal" crawl systematically under-represents:
        - Non-Western languages (despite billions of speakers)
        - Oral cultures (whose knowledge NOT transcribed to web text)
        - Low-income communities (lacking internet access to publish content)
        - Indigenous communities (often lack digital infrastructure)
        - Endangered languages (by definition, few speakers, even fewer digitally active)

      criteria:
        - "Publicly accessible URL (HTTP/HTTPS)"
        - "Not blocked by robots.txt"
        - "Reachable from seed URLs within 1 hop crawl depth"
        - "Passes adult content filter (removes pornography, not CSAM/medical/NCII)"
        - "Passes duplicate detection (within-snapshot fuzzy matching)"

    exclusion_criteria:
      - excluded: "Paywalled content"
        reason: "Not publicly accessible"
        potential_impact: |
          BIAS TOWARD FREE CONTENT: News, research, and high-quality journalism often paywalled.
          Free content skews toward user-generated (social media, forums, blogs). May encode
          "wisdom of crowds" bias vs expert knowledge.
        affected_count: "Unknown - millions of articles behind paywalls"

      - excluded: "Authentication-required content"
        reason: "Cannot access without login credentials"
        potential_impact: |
          EXCLUDES PRIVATE KNOWLEDGE: Facebook posts, LinkedIn discussions, private GitHub repos,
          medical records (HIPAA-protected), corporate intranets. Common Crawl is PUBLIC web only.
        affected_count: "Billions of pages"

      - excluded: "robots.txt disallowed paths"
        reason: "Website owner opted out via robots.txt directive"
        potential_impact: |
          OPT-OUT MECHANISM EXISTS but predates AI training use case. Robots.txt created 1994 for
          search engine indexing, not AI training. No AI-specific directive (e.g., "Disallow: /AI-Training").
          Many website owners unaware their content used for LLM training.
        affected_count: "Unknown - estimated 5-20% of web"
        method: "Automated (robots.txt parsing)"

      - excluded: "Pornographic content (adult classifier)"
        reason: "Make dataset accessible to researchers, avoid legal issues"
        potential_impact: |
          REMOVES ADULT PORNOGRAPHY but NOT CSAM (classifier cannot detect age), NOT medical nudity
          (anatomy textbooks, surgery documentation), NOT non-consensual intimate imagery (NCII/revenge porn).

          CRITICAL FAILURE: Adult classifier inherited by LAION-5B, which scraped Common Crawl URLs.
          Result: 3,226 CSAM URLs in LAION-5B (Stanford Internet Observatory 2023). Common Crawl's
          decision NOT to implement PhotoDNA hash matching ($50-100K/year) enabled downstream Tier 1 harm.
        affected_count: "Unknown - millions of pornographic pages removed, unknown CSAM/NCII remaining"
        method: "NSFW classifier (adult pornography only)"

      - excluded: "Duplicate pages (fuzzy matching within snapshot)"
        reason: "Reduce storage costs, improve data quality"
        potential_impact: "Minimal - duplicate removal unlikely to affect linguistic distribution"
        affected_count: "Estimated 20-30% of crawled pages are duplicates"
        method: "Automated (fuzzy hash matching within monthly snapshot)"

    critical_undocumented_exclusions:
      - exclusion_gap: "NO LINGUISTIC DIVERSITY TARGETS"
        description: |
          Common Crawl has ZERO linguistic diversity targets despite 15 years of operation and AI training
          becoming primary use case by 2018.

          DECISION (2008, never revisited): Universal crawl of "web as it is" - no proactive targeting of
          under-represented languages, no minimum representation thresholds, no partnerships with linguistic
          communities.

          RESULT: 90%+ English/WEIRD languages, <0.1% representation for 6,900+ low-resource languages.

          CONSEQUENCE: ALL major LLMs (GPT-3, GPT-4, LLaMA, Claude, Gemini, PaLM) trained on English-dominant
          data. Not one model's bias - SYSTEMIC bias across entire AI ecosystem. 4-5 billion people whose
          native languages have <1% representation must use AI tools in second language (English) or accept
          degraded performance.

          TIER 1 EXISTENTIAL HARM: Digital absence → no NLP tools → younger generations switch to dominant
          languages → 50-90% of world's 7,000 languages extinct by 2100 (Krauss 1992). Once last fluent
          speaker dies, language CANNOT be reconstructed from Common Crawl (it was never there).

        tools_not_used:
          - "Targeted crawls of non-English web (Africa, Asia, Pacific Islands)"
          - "Partnerships with UNESCO, SIL International, linguistic communities"
          - "Minimum representation thresholds (e.g., 1% for languages with 1M+ speakers)"
          - "Language-specific quality filtering (Kreutzer et al. 2022 showed low-resource languages have higher porn/boilerplate)"
          - "Proactive digitization funding (pay communities to create web content in endangered languages)"

        alternatives_not_considered:
          - alternative: "Targeted Linguistic Diversity ($1-5M/year)"
            description: |
              - Partner with linguistic communities to identify high-quality non-English content
              - Targeted crawls of African, Asian, Pacific Island web domains
              - Minimum 1% representation for 100 major languages (1M+ speakers each)
              - Language-specific quality thresholds (remove machine translation, boilerplate, porn)
            cost: "$1-5M/year (20-50% increase from estimated $5-10M current budget)"
            prevented_harm: |
              - 100+ languages with viable NLP training data (vs <10 currently)
              - 2-3 billion people benefit from AI tools in native languages
              - Language extinction slowed (digital presence creates economic incentive for preservation)

          - alternative: "Radical Linguistic Equity ($10-50M/year)"
            description: |
              - Proactive digitization: Fund linguistic communities to create digital content (Wikipedia, news, literature)
              - Crawl oral traditions: Transcribe recordings, oral histories, cultural knowledge
              - Minimum 0.1% representation for 1,000+ languages (10K+ speakers each)
              - Partnership with national governments, UNESCO, indigenous communities
            cost: "$10-50M/year (2-5x current budget)"
            prevented_harm: |
              - 1,000+ languages with basic NLP tools
              - 4-5 billion people benefit
              - Cultural knowledge preserved (oral traditions not lost to digital extinction)
              - Language extinction prevented for majority of living languages

        consequences:
          - "4-5 billion people whose languages have <1% Common Crawl representation"
          - "LLM performance 10-50% lower for low-resource languages (vs English SOTA)"
          - "Digital extinction accelerated: Languages with no digital footprint lose speakers faster (Kornai 2013)"
          - "Cultural erasure: Oral traditions, indigenous knowledge, non-Western worldviews absent from AI training"
          - "Economic exclusion: AI productivity tools (coding assistants, writing aids) work best in English"
          - "Educational harm: Children in low-resource communities must learn English to access AI tutors"
          - "Intergenerational injustice: Future generations inherit AI that speaks only dead/dominant languages"

        severity: "TIER 1 - EXISTENTIAL HARM (language extinction is irreversible)"

        why_undocumented: "UNKNOWN - no public deliberation or documentation of this decision exists"

        accountability_gap: |
          Most consequential decision in Common Crawl's 15-year history (affects 4-5 billion people, 6,900+ languages,
          entire AI ecosystem for decades), yet COMPLETELY UNDOCUMENTED. No record of:
          - Who made decision (founder? board? default by omission?)
          - What alternatives were considered (targeted crawls? linguistic partnerships?)
          - What rationale was used (cost? technical complexity? ideological commitment to "neutrality"?)
          - Whether linguistic consequences were even discussed (AI training not primary use case until 2018)

          THIS IS WHY ORP EXISTS: Layer 4 (Accountability Ledger) would REQUIRE this decision be logged
          BEFORE 15 years of English-dominant AI training data distribution.

      - exclusion_gap: "NO CSAM FILTERING PRE-DISTRIBUTION"
        description: |
          Common Crawl distributes web archive WITHOUT pre-filtering for child sexual abuse material (CSAM).

          RATIONALE (stated): "We archive web as-is; users responsible for filtering their use cases"
          RATIONALE (unstated): Legal liability concerns? Cost ($50-100K/year)? Ideological "neutrality"?

          CONSEQUENCE: LAION-5B scraped Common Crawl URLs, inherited CSAM URLs, distributed to millions of
          AI researchers. Stanford Internet Observatory (Dec 2023) discovered 3,226 CSAM URLs, 1,008 confirmed
          victims. Common Crawl's decision NOT to filter enabled downstream Tier 1 harm (federal crime distribution).

          COUNTER-ARGUMENT: "Common Crawl is archive, not training data curator"
          RESPONSE: By 2018, AI training was DOMINANT use case. Decision to remain "neutral" curator vs
          "responsible" AI data provider should have been explicitly debated and logged (Layer 4).

        tools_not_used:
          - "Microsoft PhotoDNA hash matching ($50-100K/year)"
          - "NCMEC (National Center for Missing & Exploited Children) hash database"
          - "Partnership with Internet Watch Foundation (IWF)"

        consequences:
          - "LAION-5B inherited 3,226 CSAM URLs from Common Crawl sources"
          - "1,008 confirmed CSAM victims re-victimized for 21 months (LAION-5B March 2022 - Dec 2023)"
          - "Stable Diffusion trained on LAION-2B (subset of LAION-5B), inherited CSAM"
          - "Common Crawl's 'neutrality' enabled Tier 1 harm downstream"

        severity: "TIER 1 - SAFETY HARM (federal crime enablement via data distribution)"

        why_undocumented: "UNKNOWN - no public deliberation exists; inferred rationale from 'archive as-is' philosophy"

      - exclusion_gap: "NO CONSENT MECHANISM FOR AI TRAINING USE CASE"
        description: |
          Common Crawl assumes "publicly accessible URL" = "consented to archiving AND AI training"

          PROBLEM: Robots.txt created 1994 for search engine indexing, NOT AI training (which didn't exist).
          No AI-specific opt-out directive. Website owners unaware content used for LLM training until
          ~2020 when GPT-3 published.

          LEGAL CHALLENGE: New York Times, Getty Images, authors, photographers suing AI companies for
          copyright infringement. Common Crawl's "we don't claim copyright" disclaimer insufficient -
          enabling unauthorized use still creates liability.

          ALTERNATIVE: AI-specific robots.txt directive (e.g., "Disallow: /AI-Training") + compensation
          mechanism (micropayments to publishers, ~$0.001/page). Cost: $10-50M infrastructure + $50-500M/year
          compensation (depending on participation).

          RESULT: Dataset size likely reduced 80-95% (most publishers won't opt-in without compensation),
          but copyright lawsuits avoided, publishers compensated, sustainable content creation enabled.

          UNKNOWN: Whether LLMs can train on 5-20% of current data and still perform well. No one has tested
          smaller, consent-based dataset at scale.

        tools_not_used:
          - "AI-specific robots.txt directive (e.g., User-agent: AI-Training, Disallow: /)"
          - "Consent dashboard for publishers"
          - "Micropayment/compensation mechanism"
          - "Notification system (inform website owners of AI training use)"

        consequences:
          - "Billions of web pages used for AI training without notification or consent"
          - "Copyright lawsuits: New York Times v. OpenAI, Getty Images v. Stability AI, Andersen et al. v. Stability AI"
          - "Estimated $1-10 billion in potential settlements/damages"
          - "Publishers not compensated despite content creating $100B+ AI company valuations"
          - "Journalism sustainability crisis (content used without payment)"

        severity: "TIER 2 - LEGAL HARM (copyright infringement, contractual obligations)"

        why_undocumented: "UNKNOWN - no public deliberation or cost-benefit analysis exists"

      - exclusion_gap: "NO LANGUAGE-SPECIFIC QUALITY FILTERING"
        description: |
          Common Crawl applies UNIVERSAL quality thresholds (duplicate detection, adult content filter) but
          NOT language-specific quality filtering.

          PROBLEM (Kreutzer et al. 2022, Google Research):
          "We find that lower-resourced languages are systematically more likely to have data quality issues:
          - Higher proportion of pornography (adult classifier misses non-English porn)
          - Higher proportion of machine-translated content (robotic, unnatural text)
          - Higher proportion of navigation boilerplate (menus, footers, vs actual content)

          Perpetuating a vicious cycle: lack of quality data → worse models → less economic incentive to
          create content → even less quality data."

          RESULT: Training on "equal" Common Crawl samples produces WORSE models for low-resource languages
          than for English (where quality filtering works better).

          ALTERNATIVE: Language-specific classifiers:
          - Detect machine translation (remove robotic text)
          - Detect boilerplate (remove navigation, preserve content)
          - Detect pornography per-language (adult classifier trained on English misses non-English)

          COST: $50K-500K (classifier development for 100+ languages)
          BENEFIT: 20-50% improvement in low-resource language model quality

        tools_not_used:
          - "Language-specific machine translation detectors"
          - "Language-specific boilerplate classifiers"
          - "Language-specific adult content filters"
          - "Quality audits per language (statistical sampling)"

        consequences:
          - "Low-resource language training data has 2-5x higher proportion of junk (porn, machine translation, boilerplate)"
          - "LLMs trained on Common Crawl perform 20-50% worse for low-resource languages vs English"
          - "Vicious cycle: poor data quality → poor models → less content creation → poorer data quality"

        severity: "TIER 3 - QUALITY HARM (degrades model performance for 6,900+ languages)"

        why_undocumented: "UNKNOWN - Kreutzer et al. 2022 study published, but no Common Crawl response or remediation"

    cleaning_decisions:
      - decision: "Deduplication (fuzzy matching within monthly snapshot)"
        rationale: "Reduce storage costs (3+ petabytes compressed), improve data quality (avoid training on exact duplicates)"
        method: "Automated fuzzy hash matching (detects near-duplicates, not just exact matches)"
        data_removed: "Estimated 20-30% of crawled pages removed as duplicates"
        impact_on_inferences: |
          MINIMAL LINGUISTIC IMPACT: Duplicate removal unlikely to systematically bias language distribution.
          However, MAY remove legitimately repeated content (news articles syndicated across sites, Wikipedia
          mirrors in low-resource languages). If low-resource languages rely more on content replication
          (fewer original sources), deduplication may disproportionately harm them. NOT STUDIED.

      - decision: "Adult content filtering (pornography classifier)"
        rationale: "Make dataset accessible to academic researchers, avoid legal issues with explicit content distribution"
        method: |
          NSFW (Not Safe For Work) classifier trained on adult pornography.
          - Detects hardcore pornography, explicit sexual imagery
          - Does NOT detect age (cannot distinguish adult porn from CSAM)
          - Does NOT detect consent (cannot distinguish consensual porn from revenge porn/NCII)
          - Does NOT detect medical context (may misclassify anatomy textbooks, surgery documentation)
        data_removed: "Unknown - estimated millions of pornographic pages"
        impact_on_inferences: |
          TIER 1 HARM ENABLEMENT: Classifier's inability to detect CSAM meant 3,226+ CSAM URLs remained in
          Common Crawl, inherited by LAION-5B, resulting in 1,008 confirmed child victims re-victimized.

          TIER 3 HARM: Medical imagery (anatomy, surgery, reproductive health) may be misclassified as
          pornography and removed, degrading medical AI training data quality.

          BIAS: Classifier likely trained on English/Western pornography. May misclassify non-Western
          cultural nudity (e.g., National Geographic imagery of indigenous communities). NOT STUDIED.

      - decision: "Language identification (detect but do NOT balance)"
        rationale: "Tag pages by language for user filtering, but do NOT enforce linguistic diversity targets"
        method: "Automated language detection (ISO 639 language codes)"
        data_removed: "None - language identification is metadata tagging, not filtering"
        impact_on_inferences: |
          CRITICAL MISSED OPPORTUNITY: Common Crawl HAS the capability to detect and balance by language
          (language identification exists), but CHOOSES not to enforce diversity targets.

          Decision (2008-2024): "Tag languages but let distribution fall wherever it may"
          Alternative (not taken): "Minimum 1% representation for languages with 1M+ speakers"

          This is CONSTITUTIVE DECISION - not technical limitation, but policy choice. Policy choice
          that was NEVER DOCUMENTED or publicly deliberated despite affecting 4-5 billion people.

    synthetic_elements:
      present: false
      description: |
        Common Crawl is 100% web-scraped content (no synthetic generation).

        HOWEVER, web itself contains synthetic elements:
        - Machine-translated content (Google Translate, DeepL automated translations)
        - AI-generated content (GPT-3/4 output published to web 2020-2024)
        - SEO spam (automated content farms, keyword stuffing)
        - Scraped/aggregated content (pages that themselves scraped other pages)

        Common Crawl does NOT filter for synthetic/AI-generated content. Result: LLMs trained on Common Crawl
        2020-2024 snapshots are partially trained on PREVIOUS LLM outputs (model collapse risk, Shumailov et al. 2023).

    known_limitations:
      - limitation: "Link rot (50%+ URLs dead within 5 years)"
        description: |
          Common Crawl archives URLs, not full web page content (some snapshots). Many URLs become
          inaccessible over time (websites shut down, pages deleted, domains expire).

          Estimate (Ainsworth et al. 2022): 50% of URLs from 2008 snapshot are dead by 2024.

          IMPACT ON REPRODUCIBILITY: Cannot fully audit dataset post-hoc (cannot retrieve dead URLs to
          verify linguistic distribution, quality, CSAM presence, etc.). ORP documentation relies on
          statistical sampling of accessible URLs + historical studies (Joshi 2020, Kreutzer 2022).
        severity: "high"

      - limitation: "Linguistic distribution is moving target (living dataset)"
        description: |
          Unlike static datasets (ImageNet 2009, LAION-5B March 2022), Common Crawl is LIVING DATASET
          with monthly snapshots. Linguistic distribution evolves over time (Chinese increasing from
          3% in 2010 to 15% in 2024).

          PROBLEM FOR ORP: Layer 1 provenance must specify WHICH snapshots used for training. GPT-3
          used 2016-2019 crawls (different distribution than 2024). LLaMA used 2017-2020 crawls.

          ORP v0.2 needs temporal provenance fields:
          - snapshot_ids: Which monthly releases used?
          - linguistic_distribution_by_snapshot: How did language distribution evolve?
          - methodology_evolution: How did crawl parameters change over time?
        severity: "high"

      - limitation: "Scale-inappropriate provenance (250 billion pages, 3 petabytes)"
        description: |
          Exhaustive provenance IMPOSSIBLE for petabyte-scale datasets. Cannot document:
          - Every excluded URL (trillions of pages NOT crawled)
          - Every cleaning decision (automated at scale)
          - Every data quality issue (Kreutzer et al. 2022 audited 1,000 pages per language, not all)

          ORP v0.2 needs "scale-appropriate provenance" category:
          - Statistical sampling: "Representative sample of 1,000 pages per language audited"
          - Known unknowns: "Exhaustive CSAM audit impossible; PhotoDNA hash matching not implemented"
          - Uncertainty quantification: "Linguistic distribution estimates ±2% margin of error"
        severity: "medium"

      - limitation: "Oral cultures systematically excluded"
        description: |
          Common Crawl is TEXT-based (web pages). Systematically excludes:
          - Oral traditions (storytelling, oral histories, not transcribed)
          - Non-literate cultures (knowledge passed down verbally, not written)
          - Low-literacy communities (even if language has writing system, may not use web)

          CONSEQUENCE: "Linguistic diversity" measured by WRITTEN text only. Oral cultures' knowledge
          INVISIBLE to AI trained on Common Crawl, even if language has millions of speakers.

          EXAMPLE: Many African languages have 10M+ speakers but <0.01% Common Crawl representation
          because oral tradition dominates over written web content.
        severity: "high"
        affected_populations: "1-2 billion people in oral-tradition-dominant cultures"

      - limitation: "No ground truth for CSAM/NCII/medical privacy violations"
        description: |
          Common Crawl does NOT audit for:
          - CSAM (child sexual abuse material)
          - NCII (non-consensual intimate imagery / revenge porn)
          - HIPAA violations (medical privacy, patient photos)

          Stanford Internet Observatory (2023) found 3,226 CSAM URLs in LAION-5B (which scraped Common Crawl),
          but this is DISCOVERED sample, not EXHAUSTIVE audit. Actual CSAM count in Common Crawl: UNKNOWN.

          ORP v0.2 needs "unknown harms" category for scale-inappropriate auditing.
        severity: "critical"

    access:
      public: true
      license: |
        Common Crawl does not claim copyright over crawled content. Original websites retain their copyrights.

        Common Crawl's disclaimer: "We do not alter content or claim ownership. Users must respect original
        copyrights when using this data."

        PROBLEM: Disclaimer insufficient for AI training use case. Copyright law unsettled on whether training
        LLMs on copyrighted content is "fair use" (US) or permitted under EU AI Act. Multiple lawsuits pending:
        - New York Times v. OpenAI (2023)
        - Getty Images v. Stability AI (2023)
        - Andersen et al. v. Stability AI (2023)

        If courts rule AI training is NOT fair use, Common Crawl's distribution of copyrighted content for
        AI training may create legal liability.

      conditions: |
        Free to download from Amazon S3 buckets (AWS egress fees apply, ~$0.09/GB).

        No authentication required, no usage restrictions stated (but users must respect original copyrights).

        CRITICAL: No AI-specific terms of service. No requirement that users:
        - Filter CSAM before training
        - Respect linguistic diversity
        - Compensate original content creators
        - Attribute sources in model outputs

        This "anything goes" access policy enabled LAION-5B's CSAM distribution, GPT-3's copyright violations,
        and 15 years of English-dominant AI training without accountability.

    attested_by:
      - name: "Asbjørn Ras"
        role: "analyst"
        affiliation: "Public Reason Project"
        date: "2026-04-07"
        statement: |
          This Layer 1 (Data Provenance) represents POST-HOC RECONSTRUCTION based on public sources:
          - Common Crawl website documentation
          - Academic papers (Joshi 2020, Kreutzer 2022, Kornai 2013)
          - LLM training papers (Brown et al. 2020 GPT-3, Touvron et al. 2023 LLaMA)
          - Stanford Internet Observatory CSAM report (2023)

          GAPS: Common Crawl's internal deliberations are NOT public. Rationales for decisions D1-D5
          (universal crawl, no linguistic targets, no CSAM filtering, no consent, no compensation) are
          INFERRED from stated philosophy ("archive web as-is") but not officially documented.

          Accountability gaps marked "UNKNOWN" indicate decisions where NO public record exists of who
          decided, what alternatives were considered, or what cost-benefit analysis (if any) was conducted.

          This document demonstrates ORP's value: If Common Crawl had conducted Layer 3 empathy mapping in
          2008, minority stress test would have identified low-resource language communities as vulnerable
          population bearing Tier 1 irreversible harm, triggering linguistic diversity targets.

