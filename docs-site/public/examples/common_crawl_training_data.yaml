l2_consequence_simulation:

  affected_population:
    description: |
      GLOBAL AI ECOSYSTEM (2020-2030):
      - 10,000+ AI researchers using Common Crawl for LLM training
      - 100+ AI companies (OpenAI, Google, Meta, Anthropic, etc.) built on Common Crawl data
      - 1 billion+ LLM users (ChatGPT, Claude, Gemini, Copilot, etc.)
      - 4-5 billion people whose native languages have <1% Common Crawl representation
      - 6,900+ linguistic communities with <0.1% representation each
      - Future generations (billions of children born 2025-2100 who will grow up with LLMs as primary information access)

      TIER 1 EXISTENTIAL HARM SCOPE:
      - 7,000 living languages as of 2024
      - 50-90% may be extinct by 2100 (Krauss 1992)
      - 3,500-6,300 languages at risk of digital extinction
      - Digital absence accelerates physical extinction (Kornai 2013 "digital language death")

    size_estimate: "8+ billion people (entire global population affected by AI trained on Common Crawl)"
    size_confidence: "high"

    geographic_distribution: |
      DIFFERENTIAL HARM BY REGION:

      **WESTERN (US/EU/Australia):**
      - Population: 1 billion (12% of world)
      - Common Crawl representation: 70%+ (English, Russian, German, French)
      - Harm: Minimal (benefits > harms)
      - LLM performance: SOTA (state-of-the-art)

      **EAST ASIA (China, Japan, Korea):**
      - Population: 1.5 billion (19% of world)
      - Common Crawl representation: 10-15% (Chinese, Japanese, Korean)
      - Harm: Moderate (performance degradation vs English)
      - LLM performance: 20-40% lower than English

      **SOUTH ASIA (India, Pakistan, Bangladesh):**
      - Population: 2 billion (25% of world)
      - Common Crawl representation: <2% (Hindi, Bengali, Urdu)
      - Harm: High (performance degradation + economic exclusion)
      - LLM performance: 40-60% lower than English

      **AFRICA:**
      - Population: 1.4 billion (17% of world)
      - Common Crawl representation: <1% (Swahili, Yoruba, Igbo, Amharic)
      - Harm: Severe (performance degradation + digital extinction)
      - LLM performance: 60-80% lower than English
      - 2,000+ African languages at risk of digital extinction

      **SOUTHEAST ASIA / PACIFIC ISLANDS:**
      - Population: 700 million (9% of world)
      - Common Crawl representation: <1%
      - Harm: Severe (digital extinction + cultural erasure)
      - LLM performance: 70-90% lower than English
      - 3,000+ languages at risk of extinction (many with <10K speakers)

      **INDIGENOUS COMMUNITIES (Americas, Australia, Arctic):**
      - Population: 500 million (6% of world)
      - Common Crawl representation: <0.1%
      - Harm: Critical (digital extinction + intergenerational injustice)
      - LLM performance: Near-zero (most languages not in training data at all)
      - 1,000+ indigenous languages at risk of extinction by 2100

    temporal_scope:
      start: "2008-09"
      end: "2100 (projected language extinction timeline)"
      duration: "92 years (one human lifetime from Common Crawl founding to projected extinction peak)"

  model:
    description: |
      LINGUISTIC EXTINCTION CASCADE MODEL:

      This model simulates how Common Crawl's linguistic distribution (constitutive decision, 2008) propagates
      through AI training (2018-2024) and accelerates language extinction (2025-2100).

      MECHANISM:
      1. Common Crawl linguistic bias (90%+ English/WEIRD) →
      2. LLM training inherits bias (all major models use Common Crawl) →
      3. LLM tools English-dominant (coding assistants, writing aids, tutors, search) →
      4. Economic incentive to learn English (AI productivity gap) →
      5. Younger generations switch to English (vs native low-resource languages) →
      6. Low-resource languages lose speakers →
      7. Even less digital content created in low-resource languages →
      8. Common Crawl bias WORSENS over time (vicious cycle) →
      9. Language extinction accelerates (digital death precedes physical death, Kornai 2013)

      COUNTERFACTUAL SCENARIOS:
      We model 4 scenarios (2008-2100) based on Common Crawl's constitutive decisions:
      - S1: Actual (universal crawl, no linguistic targets) → 3,500-6,300 languages extinct by 2100
      - S2: Targeted diversity ($1-5M/year) → 1,000-2,000 languages extinct (100+ major languages preserved)
      - S3: Radical equity ($10-50M/year) → 500-1,000 languages extinct (1,000+ languages with digital footprint)
      - S4: Proactive digitization + consent ($50-500M/year) → 200-500 languages extinct (most living languages preserved)

      CRITICAL VARIABLES:
      - linguistic_diversity_target: "none" → 3,500-6,300 extinct; "major_languages" → 1,000-2,000 extinct
      - digitization_funding: $0 → 3,500-6,300 extinct; $10-50M/year → 500-1,000 extinct

      SENSITIVITY ANALYSIS:
      Changing linguistic_diversity_target from "none" to "major_languages_1pct" (100 languages, $1-5M/year)
      prevents digital extinction for 2-3 billion people at 20-50% budget increase. This is CRITICAL variable.

    type: "System dynamics model (feedback loops, vicious cycles)"

    assumptions:
      - assumption: "Digital presence reduces extinction risk"
        confidence: "high"
        sensitivity: "high"
        evidence: |
          Kornai (2013) "Digital language death": Languages with zero digital footprint lose speakers faster.
          UNESCO (2003): "Digital divide accelerates linguistic extinction - younger generations switch to
          digitally-present languages for economic opportunity."
        notes: |
          If a language has NO presence in Common Crawl → no NLP tools (translation, speech recognition, text
          generation) → no economic incentive to use language digitally → younger generations switch to
          English/Mandarin/Spanish → language dies.

      - assumption: "AI training data distribution determines model performance"
        confidence: "high"
        sensitivity: "high"
        evidence: |
          Brown et al. (2020) GPT-3: English 93% training data → English SOTA performance, Spanish 7% → 20-30%
          lower performance. Touvron et al. (2023) LLaMA: Similar pattern. Direct correlation between training
          data quantity and model quality.

      - assumption: "LLM performance creates economic advantage"
        confidence: "medium"
        sensitivity: "high"
        evidence: |
          McKinsey (2023): "AI could add $13 trillion to global economy by 2030." GitHub Copilot: 55% faster
          coding (English-dominant). English speakers capture disproportionate productivity gains.
        notes: |
          UNTESTED: Whether LLM productivity gap large enough to drive language switching. Plausible mechanism
          but limited empirical data (AI tools too new). Mark as medium confidence.

      - assumption: "50-90% of languages will be extinct by 2100 (baseline, without AI acceleration)"
        confidence: "medium"
        sensitivity: "high"
        evidence: |
          Krauss (1992): "The world's languages in crisis" - 50-90% extinction by 2100 (pre-AI era projection).
          UNESCO (2010): 2,500+ languages "endangered" (children not learning as mother tongue).
        notes: |
          This is BASELINE extinction (without AI). AI may ACCELERATE extinction (digital death precedes
          physical death, Kornai 2013), but hard to quantify. S1 (actual) assumes AI adds 10-20% to baseline
          extinction rate. S2-S4 assume AI can SLOW extinction if linguistic diversity prioritized.

      - assumption: "Linguistic diversity targets feasible at $1-50M/year"
        confidence: "medium"
        sensitivity: "critical"
        evidence: |
          Estimated costs:
          - Targeted crawls: $1-5M/year (partner with linguistic communities, crawl non-English web)
          - Proactive digitization: $10-50M/year (fund communities to create Wikipedia, news, literature)
          - Consent infrastructure: $50-500M/year (micropayments to publishers)
        notes: |
          NO ONE HAS TRIED THIS AT SCALE. Estimates based on:
          - UNESCO linguistic preservation programs ($10-100M budgets)
          - Common Crawl current budget ($5-10M/year estimated)
          - Assumption: 2-5x budget increase enables 100-1,000 language preservation

          Mark as MEDIUM confidence - plausible but untested. This is research question, not settled fact.

      - assumption: "Younger generations switch languages for economic opportunity"
        confidence: "high"
        sensitivity: "high"
        evidence: |
          Historical pattern: Rural-to-urban migration, younger generations learn dominant language (English,
          Mandarin, Spanish) for jobs, education, social mobility. Linguistic shift accelerates with globalization.
        notes: |
          AI may ACCELERATE this pattern (digital economy requires English-dominant AI tools) or REVERSE it
          (if AI tools available in native languages, less pressure to switch). S1 assumes acceleration,
          S2-S4 assume reversal if linguistic diversity prioritized.

  variables:
    - id: "linguistic_diversity_target"
      name: "Linguistic Diversity Target"
      description: |
        Common Crawl's policy on linguistic representation. Four levels:
        - "none": Universal crawl, no diversity targets (ACTUAL as of 2024)
        - "major_languages_1pct": 100+ languages with 1M+ speakers get minimum 1% representation each
        - "living_languages_0.1pct": 1,000+ languages with 10K+ speakers get minimum 0.1% each
        - "all_languages_proactive": Proactive digitization of all 7,000 living languages (transcribe oral traditions, fund digital content creation)
      unit: "policy_enum"
      actual_value: "none"
      default_value: "none"
      plausible_range:
        min: "none"
        max: "all_languages_proactive"
      notes: |
        CRITICAL VARIABLE: Changing from "none" to "major_languages_1pct" prevents digital extinction for
        2-3 billion people (100+ major languages preserved). Cost: $1-5M/year (20-50% budget increase).

        Decision made in 2008 (founding), never revisited despite AI training becoming dominant use case by 2018.

    - id: "digitization_funding"
      name: "Annual Funding for Linguistic Digitization"
      description: |
