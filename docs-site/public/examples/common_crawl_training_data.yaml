      representation_in_decision_making: "high"
      population_size: "10,000+"
      stakeholder_power: "high"
      benefits:
        - "Free training data: $0 cost vs $10-100M to crawl web independently"
        - "Research enablement: 2,000+ papers published using Common Crawl datasets"
        - "Career advancement: GPT-3, LLaMA, Claude papers cite Common Crawl (h-index boosts)"
        - "Reproducibility: Shared dataset enables comparison across models"
      harms:
