        PERFORMANCE: 60% → 10% gap for 1,000+ languages
        CULTURE: Oral traditions, indigenous knowledge preserved

        FEASIBILITY: $570M total cost = 0.6% of AI company valuations ($100B+) enabled by Common Crawl data.
        If Common Crawl captured even 1% of value created, intervention would be self-funding.

    - id: "S4_consent_based_crawl"
      name: "S4: Consent-Based Crawl with Compensation ($50-500M/year, Copyright Resolved)"
      description: |
        COUNTERFACTUAL: What if Common Crawl required explicit consent for AI training use + compensated publishers?

        INTERVENTION:
        - Shift from "opt-out" (robots.txt) to "opt-in" (explicit consent for AI training)
        - AI-specific robots.txt directive (robots.txt: "Allow: /AI-Training")
        - Micropayment mechanism (compensate publishers ~$0.001 per page crawled for AI training)
        - Consent dashboard (publishers control which AI companies access data, set prices)
        - Linguistic diversity bonus (pay 10x rate for low-resource language content)
        - Cost: $10-50M infrastructure + $50-500M/year publisher compensation

        RESULT (2008-2024):
        - Dataset size reduced 80-95% (most publishers won't opt-in without compensation)
        - BUT: Remaining 5-20% is CONSENTED, copyright-clean, lawsuit-free
        - Publishers compensated (sustainable journalism, content creation)
        - Linguistic diversity improved (bonus payments incentivize low-resource language content)

        PROJECTION (2025-2100):
        - Economic incentive to create content in low-resource languages (10x payment bonus)
        - Baseline extinction: 3,500-6,300 languages
        - AI deceleration: 0.5x (smaller dataset but economically incentivized linguistic diversity)
        - TOTAL: 1,750-3,150 languages extinct (25-45% vs 80% in S1)
        - Copyright lawsuits avoided ($1-10B in settlements)

        UNKNOWN: Whether LLMs trained on 5-20% of current data (but high-quality, consented, diverse) perform
        as well as 100% (unconsented, biased). NO ONE HAS TESTED THIS AT SCALE.

      outcome_variables:
        - variable: "linguistic_diversity_target"
          value: "major_languages_1pct_with_economic_incentive"
        - variable: "digitization_funding"
          value: 50
        - variable: "ai_training_adoption_rate"
          value: 70
        - variable: "language_extinction_baseline"
          value: 4900
        - variable: "ai_acceleration_factor"
          value: 0.5

      outcomes:
        - outcome: "Languages extinct by 2100"
          value: 2450
          unit: "count"
          description: |
            4,900 baseline (70%) × 0.5 AI deceleration = 2,450 languages extinct (35% of living languages).

            3,185 languages SAVED vs S1 (5,635 - 2,450). This is 57% reduction in extinction.

        - outcome: "Dataset size (vs S1)"
          value: 15
          unit: "percent"
          description: |
            5-20% of S1 size (publishers opt-in with compensation). Use midpoint 15%.

            UNKNOWN: Whether smaller dataset trains viable LLMs. Possible that higher-quality, consented data
            compensates for lower quantity. Needs empirical testing.

        - outcome: "Copyright lawsuits avoided"
          value: 5000
          unit: "USD_millions"
          description: |
            Estimated $1-10B in potential copyright settlements (New York Times, Getty Images, authors lawsuits).
            Use midpoint $5B avoided by consent-based crawl.

        - outcome: "Publisher compensation paid"
          value: 4500
          unit: "USD_millions"
          description: |
            $50-500M/year × 15 years = $750M-$7.5B. Use midpoint $4.5B paid to publishers.

        - outcome: "Cost of Common Crawl (2008-2024)"
          value: 4620
          unit: "USD_millions"
          description: |
            $120M baseline + $50M infrastructure + $4.5B compensation = $4.62B.

            CONTEXT: Still <5% of AI company valuations ($100B+). If AI companies captured value fairly,
            intervention would be self-funding.

        - outcome: "Linguistic diversity improved (via economic incentive)"
          value: "high"
          unit: "qualitative"
          description: |
            10x payment bonus for low-resource language content creates economic incentive for communities to
            publish digitally. Reverses digital extinction feedback loop (no content → no tools → no content)
            to virtuous cycle (economic incentive → more content → better tools → more economic opportunity).

      comparison_to_actual: |
        COST: +$4.5B over 15 years (40x budget increase, but <5% of AI value created)
        BENEFIT: 3,185 languages saved (57% reduction), copyright lawsuits avoided ($5B), publishers compensated ($4.5B)
        DATASET: 85% smaller (UNKNOWN whether viable for LLM training - needs empirical testing)
        PERFORMANCE: Potentially equal or better (higher quality, less junk) but UNTESTED
        ETHICS: Consent-based, fair compensation, sustainable content creation

        FEASIBILITY: Requires AI industry to share value created. Current model (free data → $100B valuations)
        unsustainable long-term (lawsuits, regulatory backlash, publisher collapse).

  sensitivity_analysis:
    notes: |
      CRITICAL VARIABLES (High sensitivity = large outcome changes from small input changes):

      1. **linguistic_diversity_target** (CRITICAL):
         - Change from "none" to "major_languages_1pct" prevents 3,185 language extinctions (57% reduction)
         - Cost: $1-5M/year (20-50% budget increase)
         - Sensitivity: CRITICAL - most cost-effective intervention

      2. **digitization_funding** (HIGH):
         - $0 → $30M/year: 4,165 languages saved (74% reduction)
         - $0 → $50M/year (with consent): 3,185 languages saved + copyright resolved
         - Sensitivity: HIGH - directly enables digital content creation in low-resource languages

      3. **ai_acceleration_factor** (MEDIUM):
         - 1.15 (actual, AI accelerates extinction) → 0.3 (AI slows extinction via NLP tools)
         - Depends on whether NLP tools create economic incentive to preserve languages
         - Sensitivity: MEDIUM - uncertain mechanism, but large effect size

      4. **language_extinction_baseline** (LOW):
         - Baseline (50-90%) affects absolute numbers but not RELATIVE intervention effectiveness
         - All scenarios reduce extinction 35-74% regardless of baseline
         - Sensitivity: LOW - intervention works across range of baseline assumptions

      RADICAL VARIABLES (Untested, could dramatically change outcomes):

      1. **consent_mechanism** (RADICAL):
         - Shift from opt-out to opt-in reduces dataset 80-95%
         - UNKNOWN: Whether LLMs train on 5-20% data and still perform well
         - NO ONE HAS TESTED THIS AT SCALE
         - Could make S4 infeasible OR reveal that current 100% dataset is overkill (diminishing returns)

      2. **Economic incentive for low-resource content** (RADICAL):
         - Paying 10x for low-resource language content could REVERSE digital extinction feedback loop
         - Creates economic opportunity → more content → better NLP tools → more opportunity (virtuous cycle)
         - UNTESTED: Whether $50-500M/year sufficient to incentivize 1,000+ communities
         - Could be TRANSFORMATIVE if it works, but speculative

      RECOMMENDED INTERVENTION (Cost-Benefit):
      S2 (Targeted Linguistic Diversity) is most cost-effective:
      - Cost: $60M additional over 15 years (+50% budget)
      - Benefit: 3,185 languages saved (57% extinction reduction)
      - Cost per language saved: $18,848 (10-20x cheaper than UNESCO programs)
      - Feasibility: Proven (UNESCO, SIL International partnerships exist)

      S3 (Radical Equity) has highest benefit (4,165 languages saved) but 7.5x cost ($450M vs $60M).
      S4 (Consent) resolves copyright but shrinks dataset 85% (UNKNOWN if viable).

