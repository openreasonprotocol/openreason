      unit: "multiplier"
      actual_value: 1.15
      default_value: 1.0
      plausible_range:
        min: 0.5
        max: 2.0
      notes: |
        UNCERTAIN - AI too new to measure empirically. Estimate 1.15 (15% acceleration) based on:
        - Digital death precedes physical death (Kornai 2013)
        - Economic pressure to learn English for AI tools (McKinsey 2023)
        - Younger generations switching to English for ChatGPT, GitHub Copilot access

        S1 (actual) assumes 1.15 acceleration. S2-S4 assume <1.0 (AI slows extinction if linguistic diversity
        prioritized, because NLP tools make language economically valuable).

