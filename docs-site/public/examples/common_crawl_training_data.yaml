        If no: Trade-off between dataset size vs consent/compensation (ethical dilemma)

        FORK and test empirically: Train LLM on consent-based Common Crawl subset, benchmark against GPT-3/4/LLaMA.

  notes: |
    LAYER 5 KEY INSIGHT: Common Crawl has NO known forks (2008-2024, 15 years).

    Why? Barriers to forking:
    1. Scale: 250B pages, 3PB data - cannot fork on laptop (requires AWS-scale infrastructure)
    2. Cost: $5-10M/year to operate web crawl at Common Crawl scale
    3. Network effects: All major LLMs use Common Crawl (switching costs high)
    4. "Open data" framing: Forking appears unnecessary (just use Common Crawl as-is)

    But POTENTIAL FORKS demonstrate:
    - S2 (Linguistic Equity): $60M prevents 3,185 language extinctions (FEASIBLE)
    - S3 (Radical Equity): $570M prevents 4,165 extinctions (TRANSFORMATIVE)
    - S4 (Consent): $4.6B resolves copyright + saves 3,185 languages (ETHICAL but EXPENSIVE)

    ORP'S FORK-FIRST PHILOSOPHY: Disagreement resolved through DEMONSTRATION (build alternative), not debate.

    If linguistic communities disagree with Common Crawl's D2 (no diversity targets), they should build
    LINGUISTIC HERITAGE AI FOUNDATION - proactive digitization, transcription, multilingual corpus.

    If publishers disagree with D5 (no compensation), they should build CONSENT-BASED CRAWL - micropayments,
    AI-specific opt-in, fair value distribution.

    Fork-first enables PLURALISM: Multiple datasets with different values (neutrality vs equity vs consent)
    can coexist, letting AI developers choose.
