        - "GitHub competitive advantage: Copilot exclusive to GitHub (not GitLab, Bitbucket)"
        - "Developer ecosystem lock-in: Copilot users prefer GitHub platform"
        - "Azure cloud revenue: Codex training/inference on Azure ($10M+/year compute)"
      harms:
