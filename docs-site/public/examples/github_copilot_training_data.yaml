orp_version: "0.2"
post_hoc: true
extensions:
  - orp-ai-training-v1
document_id: "github-copilot-training-data-2026"
title: "GitHub Copilot Training Data - License Violations and Open Source Exploitation"
domain: ai-training
authors:
  - name: "Asbjørn Ras"
    role: author
created: "2026-04-07"
last_modified: "2026-04-07"
status: draft
summary: |
  Post-hoc reconstruction of GitHub Copilot (launched June 2021), an AI pair programming tool trained on billions
  of lines of public code from GitHub. Five constitutive decisions (2020-2021) made without transparent license
  compliance analysis resulted in TIER 2 LEGAL HARM (GPL copyleft violations, MIT/Apache attribution stripped,
  $1-10B lawsuit damages pending), TIER 3 ECONOMIC HARM (10 million OSS maintainers receive $0 compensation despite
  code being training data for $100M+ revenue tool), and TIER 4 ECOSYSTEM HARM (open source sustainability crisis
  accelerated - unpaid labor commercially exploited). Alternatives: License-compliant training (permissive licenses
  only) eliminates legal risk at 10-20% performance cost; 10% revenue sharing ($10M+/year) to OSS maintainers
  improves ecosystem sustainability at minimal cost (90% profit margin retained). Decisions made for UNSTATED
  reasons (maximize training data? ignore legal risk? exploit OSS labor?) - rationales not publicly documented.
  ORP's value: If Microsoft/GitHub had conducted Layer 3 empathy mapping in 2020, minority stress test would have
  identified OSS maintainers as absent node bearing disproportionate harm (labor exploitation, license violations),
  triggering license compliance and revenue sharing mechanisms preventing $1-10B lawsuit and ecosystem crisis.

# ============================================================================
# LAYER 1: DATA PROVENANCE
# ============================================================================

l1_data_provenance:

  - dataset_id: "github-public-code-2020-2021"
    name: "GitHub Public Repositories (Codex Training Corpus)"

    description: |
      GitHub Copilot is trained on OpenAI Codex, a GPT-3 variant fine-tuned on code from public GitHub repositories.
      Training data: Billions of lines of code from 54+ million GitHub repositories (Chen et al. 2021 disclosed
      54M for Python Codex; full Copilot likely uses 100M+ repos across all languages).

      CRITICAL CONTEXT: GitHub Copilot is CODE MODALITY dataset (first in our AI training data sequence after
      images/text). This introduces unique legal dimensions:
      - Software licenses (GPL, MIT, Apache, BSD) have LEGAL FORCE (contract + copyright)
      - GPL "copyleft" requires derivative works be GPL-licensed (viral effect)
      - MIT/Apache require attribution (copyright notice preserved)
      - DMCA § 1202 prohibits removing copyright management information (license headers)

      HARM PATTERN: CONSTITUTIVE OPACITY (2020-2021) → LICENSE VIOLATIONS (2021-2024) → ECOSYSTEM CRISIS (2022-present).
      Unlike ImageNet (bias), LAION-5B (safety), Common Crawl (linguistic extinction), GitHub Copilot represents
      LEGAL + ECONOMIC + ECOSYSTEM harm triad:
      - LEGAL: GPL violations ($1-10B lawsuit pending, Doe v. GitHub 2022)
      - ECONOMIC: OSS maintainers $0 compensation despite $100M+ Copilot revenue (labor exploitation)
      - ECOSYSTEM: Open source sustainability crisis (unpaid labor commercially exploited, maintainers burn out)

      Post-hoc remediation IMPOSSIBLE: Cannot "un-train" Codex on GPL code, license violations already propagated
      to 1M+ Copilot users for 3+ years (2021-2024). Unlike LAION-5B (removed 2,236 CSAM URLs), license violations
      baked into model weights PERMANENTLY.

    source: "GitHub public repositories (2008-2021 snapshot, 100M+ repos estimated)"

    collection_method: |
      TRAINING METHODOLOGY (inferred from Chen et al. 2021, OpenAI Codex paper):

      1. REPOSITORY SELECTION:
         - Source: All public GitHub repositories (2008-2021 snapshot, ~100M repos)
         - Languages: Python, JavaScript, TypeScript, Ruby, Go, Java, C++, C#, PHP (most represented)
         - Size filter: >1KB file size (exclude trivial files)
         - Auto-generated filter: Exclude likely auto-generated code (heuristics: repetitive patterns, tool signatures)

      2. CODE EXTRACTION:
         - Extract all code files (.py, .js, .ts, .rb, .go, .java, .cpp, .cs, .php, etc.)
         - Strip comments (in some preprocessing, unclear if all)
         - Strip license headers (CRITICAL: DMCA § 1202 violation - removes copyright management information)
         - Deduplicate exact matches (within-file and cross-file)

      3. LICENSE FILTERING:
         - **NONE** - No filtering by license type (GPL included alongside MIT, Apache, BSD, proprietary)
         - Rationale (unstated): Maximize training data size for best model performance
         - Consequence: GPL code included, copyleft potentially violated

      4. QUALITY/SECURITY FILTERING:
         - **MINIMAL** - Auto-generated code filtered, but no security vulnerability filtering
         - Result: 40% of Copilot outputs contain security vulnerabilities (Pearce et al. 2021 study)
         - Propagates bad practices: SQL injection, path traversal, command injection from training data

      5. TRAINING:
         - Model: GPT-3 architecture (12B parameters for Codex)
         - Fine-tuning: Supervised learning on code (predict next token given context)
         - Infrastructure: Azure (Microsoft cloud, GitHub is Microsoft subsidiary)
         - Duration: Several months (2020-2021)
         - Cost: Estimated $10-50M in compute (12B parameter model training)

      CRITICAL LIMITATION: GitHub/OpenAI have NOT disclosed:
      - Exact list of repositories used (trade secret?)
      - License distribution (% GPL vs MIT vs Apache vs proprietary)
      - Whether deleted repositories included (GitHub retains data after repo deletion)
      - Whether private repositories accidentally included (data breach risk - GitHub denies this)
      - Opt-out mechanism (repository owners cannot prevent inclusion)

    date_range:
      start: "2008"
      end: "2021"
      temporal_scope: "13 years of GitHub history (2008-2021)"

    geographic_scope: |
      GLOBAL (GitHub hosts code from worldwide developers)

      WESTERN-DOMINATED (in practice):
      - 60%+ repositories from US/EU developers (English comments, Western coding conventions)
      - 80%+ code in English (comments, variable names, documentation)
      - <10% code from Global South (Africa, South Asia, Southeast Asia)

      LANGUAGE DISTRIBUTION (programming languages):
      - JavaScript: 25% (most popular language on GitHub)
      - Python: 20%
      - Java: 15%
      - TypeScript: 10%
      - C++: 8%
      - C#: 7%
      - PHP: 5%
      - Ruby: 4%
      - Go: 3%
      - Other: 3%

      LICENSE DISTRIBUTION (estimated from GitHub surveys, not Copilot-specific):
      - MIT License: 45% (most permissive, attribution required)
      - Apache 2.0: 15% (permissive, attribution required, patent grant)
      - GPL (v2/v3): 15% (copyleft, derivative works must be GPL)
      - BSD (2-clause/3-clause): 10% (permissive, attribution required)
      - No license specified: 10% (legally "all rights reserved", not actually open source)
      - Other licenses: 5% (Creative Commons, custom, etc.)

      CRITICAL: 15% GPL means ~15M repositories are GPL-licensed in training data. If Copilot outputs are
      "derivative works" of GPL code, ALL Copilot outputs must be GPL-licensed (copyleft viral effect).
      But Copilot used for proprietary software development → GPL violated.

    inclusion_criteria:
      description: |
        UNIVERSAL INCLUSION (in theory):
        - Any public GitHub repository (2008-2021)
        - All programming languages
        - All license types (no filtering)

        BIASED INCLUSION (in practice):
        - Western developers over-represented (60%+ US/EU)
        - English-language code over-represented (80%+ English comments)
        - Popular languages over-represented (JavaScript, Python, Java)
        - Large repositories over-represented (more code = more training tokens)
        - "Star" bias: Popular repositories (high stars/forks) may be oversampled

      criteria:
        - "Public GitHub repository (not private)"
        - "Code file >1KB (exclude trivial files)"
        - "Not auto-generated (heuristic filter)"
        - "Programming language supported (Python, JS, TS, Ruby, Go, Java, C++, C#, PHP, etc.)"

    exclusion_criteria:
      - excluded: "Private repositories"
        reason: "Not publicly accessible (GitHub ToS respects privacy)"
        potential_impact: |
          EXCLUDES PROPRIETARY CODE: Corporate codebases, personal projects, trade secrets not in training data.
          But public repos may contain trade secrets accidentally committed (leaked AWS keys, passwords).
        affected_count: "~50M private repos (estimated, GitHub does not disclose)"

      - excluded: "Auto-generated code (heuristic filter)"
        reason: "Low quality, not human-written (skews model toward robotic patterns)"
        potential_impact: |
          Improves model quality (more human-like code generation). But heuristic filter may miss some
          auto-generated code, or falsely exclude human-written repetitive code.
        affected_count: "Unknown - estimated 10-20% of code files filtered"
        method: "Automated (heuristics: repetitive patterns, tool signatures like 'Generated by X')"

      - excluded: "Files <1KB"
        reason: "Trivial code, insufficient context for learning"
        potential_impact: "Minimal - small files unlikely to be useful training data"
        affected_count: "Estimated 30-40% of files <1KB"
        method: "Automated (file size check)"

    critical_undocumented_exclusions:
      - exclusion_gap: "NO LICENSE-BASED FILTERING (GPL Code Included)"
        description: |
          GitHub Copilot training data includes GPL-licensed code (estimated 15% of repositories) WITHOUT
          any mechanism to honor GPL copyleft requirements.

          GPL "COPYLEFT" VIRAL EFFECT:
          - GPL v2/v3 requires derivative works be GPL-licensed
          - Question: Is Copilot output a "derivative work" of GPL training data?
          - If YES: All Copilot-generated code must be GPL (violates proprietary software creation)
          - If NO: GPL training allowed under "fair use", but stripping license headers violates GPL § 5

          LEGAL CHALLENGE (Doe v. GitHub, November 2022):
          - Class action by OSS developers: "Copilot reproduces licensed code without attribution"
          - Claims: Copyright infringement, DMCA § 1202 violations, breach of contract (license terms)
          - Estimated damages: $1-10B (9,000+ class members, billions in Copilot revenue at stake)
          - Status: Ongoing as of 2024 (some claims dismissed, core claims proceed)

          REPRODUCES VERBATIM CODE: Nguyen & Nadi (2022) study found Copilot reproduces verbatim code from
          training data 0.1% of time (1 in 1,000 suggestions). 89 detected cases where GPL/MIT code reproduced
          without attribution.

        tools_not_used:
          - "License-based filtering (exclude GPL, train only on MIT/Apache/BSD)"
          - "Attribution preservation (include original author/license when code reproduced)"
          - "GPL compliance check (warn users when Copilot output may be GPL-derived)"

        alternatives_not_considered:
          - alternative: "License-Compliant Training (Permissive Licenses Only)"
            description: |
              Train Codex ONLY on permissively licensed code (MIT, Apache, BSD with attribution compliance).
              - Exclude GPL (copyleft risk eliminated)
              - Preserve attribution (include original author/license in outputs when code reproduced)
              - Comply with MIT/Apache requirements (copyright notice preserved)
            cost: "$0 additional (license filtering is data preprocessing)"
            impact_on_performance: "10-20% lower quality (less training data, ~85M vs 100M repos)"
            prevented_harm: |
              - $1-10B lawsuit risk eliminated (GPL compliance achieved)
              - MIT/Apache attribution preserved (DMCA § 1202 compliance)
              - OSS community trust maintained (respects licenses)

          - alternative: "GPL-Aware Copilot (Warn Users of License Implications)"
            description: |
              Train on all code (including GPL) but ADD WARNING SYSTEM:
              - Detect when Copilot output likely derived from GPL code (fingerprinting)
              - Warn user: "This suggestion may be derived from GPL-licensed code. Use in proprietary software may violate license."
              - User can choose: Accept (and GPL-license their code), reject, or request alternative suggestion
            cost: "$1-5M (develop GPL detection system, train classifier)"
            prevented_harm: |
              - Users informed of legal risk (can make educated decision)
              - GPL violations reduced (users choose not to use GPL-derived suggestions in proprietary code)
              - Lawsuit risk partially mitigated (demonstrated good faith effort to comply)

        consequences:
          - "Doe v. GitHub lawsuit: $1-10B damages pending (2022-2024 ongoing)"
          - "GPL violations: Copilot used for proprietary software despite GPL training data (copyleft violated)"
          - "DMCA § 1202: License headers stripped from training data (copyright management info removed)"
          - "MIT/Apache violations: Attribution not provided (copyright notice requirement violated)"
          - "OSS community trust eroded: Maintainers see licenses ignored, code commercially exploited without respect"

        severity: "TIER 2 - LEGAL HARM (copyright infringement, contract breach, $1-10B liability)"

        why_undocumented: |
          UNKNOWN - Microsoft/GitHub have not publicly disclosed:
          - Whether license filtering was considered (trade secret? legal advice privilege?)
          - What legal analysis was conducted (if any) regarding GPL copyleft implications
          - Why decision made to include GPL code despite legal risk

          Possible rationales (UNSTATED):
          - Maximize training data (best model performance requires billions of lines, license filtering reduces data 15-30%)
          - Legal uncertainty ("fair use" argument - unclear if courts will rule AI training as fair use)
          - Calculated risk (lawsuit damages <$10B vs Copilot revenue $100M+/year = ROI positive even if lawsuit lost)

        accountability_gap: |
          COMPLETE ACCOUNTABILITY FAILURE: Most legally consequential decision (GPL violations, $1-10B lawsuit),
          yet ZERO public documentation of:
          - Who decided (Microsoft legal? GitHub leadership? OpenAI engineering?)
          - What alternatives considered (license-compliant training? GPL-aware warnings?)
          - What legal analysis conducted (was GPL copyleft risk discussed?)
          - Why decision made (maximize data? ignore risk? "fair use" bet?)

          This is EXACTLY why ORP exists: Layer 4 would REQUIRE constitutive legal decisions be logged BEFORE
          deployment, with rationales and alternatives documented.

      - exclusion_gap: "NO SECURITY VULNERABILITY FILTERING"
        description: |
          GitHub Copilot training data includes VULNERABLE CODE without filtering.

          SECURITY RESEARCH FINDINGS:
          - Pearce et al. (2021, NYU): 40% of Copilot suggestions contain exploitable vulnerabilities
          - Categories: SQL injection, path traversal, command injection, XSS, buffer overflow
          - Mechanism: Training on "average GitHub code" reproduces "average security flaws"

          ROOT CAUSE: No curation for security. Training data includes:
          - Vulnerable code from novice developers (learning mistakes)
          - Proof-of-concept exploits (security researchers demonstrating vulnerabilities)
          - Legacy code (pre-modern security practices, e.g., MD5 hashing, SQL string concatenation)

          PROPAGATES BAD PRACTICES: Copilot suggests insecure patterns to new developers, perpetuating
          security flaws across millions of projects.

        tools_not_used:
          - "Security audit of training data (identify and remove vulnerable code)"
          - "Curated 'secure code' training set (use only security-reviewed projects)"
          - "Vulnerability detection in outputs (scan Copilot suggestions for known vulnerability patterns)"

        consequences:
          - "40% of Copilot outputs contain vulnerabilities (Pearce et al. 2021)"
          - "Novice developers accept insecure suggestions (unaware of security implications)"
          - "Vulnerable code propagated to production systems (data breaches, exploits)"
          - "Security debt created: Millions of projects now contain Copilot-generated vulnerabilities"

        severity: "TIER 5 - SECURITY HARM (vulnerability propagation, potential data breaches)"

        why_undocumented: |
          UNKNOWN - OpenAI/GitHub have not disclosed why security filtering not implemented.

          Possible rationales (UNSTATED):
          - Difficult at scale (54M repos, billions of lines - manual security review infeasible)
          - Automated detection insufficient (static analysis false positives/negatives)
          - Cost (security-reviewed code subset too small for effective training)

      - exclusion_gap: "NO COMPENSATION MECHANISM FOR OSS MAINTAINERS"
        description: |
          GitHub Copilot generates $100M+ revenue/year (estimated 2023) from tool trained on OSS code.
          OSS maintainers whose code is training data: $0 compensation.

          WEALTH TRANSFER PATTERN:
          - OSS maintainers: Create code → billions of lines of unpaid labor → $0 from Copilot
          - Microsoft/GitHub: Scrape code → train Copilot → $100M+ revenue → 100% captured
          - Asymmetry: Maintainers bear costs (time, labor), Microsoft captures all economic value

          SUSTAINABILITY CRISIS: Open source relies on unpaid labor (Eghbal 2020 "Working in Public").
          Commercial exploitation without compensation accelerates maintainer burnout:
          - Faker.js incident (Jan 2022): Maintainer deleted library ("Fortune 500 using my free labor")
          - Left-pad incident (2016): 11-line NPM package broke thousands of projects when maintainer removed it
          - OpenSSL Heartbleed (2014): Critical security infrastructure maintained by 1 person, $2K/year donations

          GitHub Sponsors (2019-present): Platform for funding OSS maintainers, but:
          - <5% of projects have sponsors
          - ~$100M/year total funding (vs $1T+ commercial value extracted from OSS)
          - Copilot revenue ($100M+/year) could DOUBLE GitHub Sponsors funding if 10% shared

        tools_not_used:
          - "Revenue sharing (10% of Copilot subscriptions to OSS maintainers whose code used)"
          - "Attribution tracking (track which repositories Copilot draws from, compensate proportionally)"
          - "GitHub Sponsors integration (Copilot subscription includes $1/month to Sponsors pool)"

        alternatives_not_considered:
          - alternative: "10% Revenue Sharing to OSS Maintainers"
            description: |
              Distribute 10% of Copilot revenue ($10M+/year) to OSS maintainers whose code is training data.
              - Track repository usage (measure how often Copilot suggestions derive from each repo)
              - Proportional compensation (popular repos like React, Django, NumPy get more)
              - GitHub Sponsors integration (automatic monthly payouts)
            cost: "$10M+/year (10% of revenue)"
            benefit: |
              - OSS maintainers receive financial support (improves sustainability)
              - Microsoft goodwill (demonstrates respect for OSS community)
              - Lawsuit risk reduced (compensation demonstrates good faith)
              - 90% profit margin RETAINED (still $90M+/year profit to Microsoft)

        consequences:
          - "10M OSS maintainers: $0 compensation despite code being Copilot training data"
          - "Sustainability crisis: Maintainers burn out without financial support"
          - "Resentment: OSS community sees labor exploited, licenses ignored"
          - "Future risk: If maintainers stop contributing, Copilot training data quality degrades"

        severity: "TIER 3 - ECONOMIC HARM (labor exploitation, unfair value distribution)"

        why_undocumented: |
          UNSTATED - Microsoft/GitHub have not publicly disclosed why compensation not implemented.

          Possible rationales:
          - Legal: No obligation to compensate ("public code" = no expectation of payment)
          - Precedent: Worried compensation sets precedent for other AI training datasets
          - Cost: Prefer 100% profit margin over 90% (maximize shareholder value)

      - exclusion_gap: "NO OPT-OUT MECHANISM FOR REPOSITORY OWNERS"
        description: |
          Repository owners cannot prevent their code being used for Copilot training.

          GitHub ToS (pre-2021): "By setting your repositories to be viewed publicly, you agree to allow others
          to view and fork your repositories."
          - Does NOT mention AI training (ToS created before Copilot existed)
          - "Fork" means copy repository, NOT "train commercial AI model on your code"

          ANALOGOUS TO COMMON CRAWL PROBLEM: Robots.txt created 1994 for search indexing, not AI training.
          Repository owners unaware code would be used for commercial AI until Copilot launched (June 2021).

          LICENSE-BASED OPT-OUT REJECTED: GPL "no proprietary derivatives" could be interpreted as opt-out,
          but GitHub/Microsoft ignored this (trained on GPL code anyway).

        tools_not_used:
          - "Repository-level opt-out flag (repo owner sets 'Do not use for AI training')"
          - "License-based opt-out (honor GPL 'no proprietary derivatives' as implicit opt-out)"
          - "Notification system (inform repo owners their code used for Copilot training)"

        consequences:
          - "100M+ repos used without notification or consent"
          - "Repository owners unable to prevent commercial exploitation of their code"
          - "Licenses ignored (GPL copyleft, MIT/Apache attribution not respected)"

        severity: "TIER 3 - CONSENT HARM (code used without notification, licenses ignored)"

        why_undocumented: "UNSTATED - Microsoft/GitHub position is 'public code = no expectation of privacy', but have not addressed license terms"

    cleaning_decisions:
      - decision: "Strip license headers from code files"
        rationale: "License headers are boilerplate, not functional code (standard ML preprocessing)"
        method: "Automated (remove comments at top of files matching license templates)"
        data_removed: "Estimated 50-80% of files had license headers removed"
        impact_on_inferences: |
          DMCA § 1202 VIOLATION: Removing copyright management information (license headers) prohibited by law.

          MIT License text: "The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software."

          By stripping license headers, Copilot preprocessing violates MIT/Apache/BSD attribution requirements.
          Outputs do NOT include original author/license info even when code reproduced verbatim.

      - decision: "Deduplicate exact code matches"
        rationale: "Avoid model memorizing exact duplicates (improves generalization)"
        method: "Automated (hash-based deduplication within and across files)"
        data_removed: "Estimated 10-20% of code lines removed as exact duplicates"
        impact_on_inferences: |
          Improves model quality (reduces memorization). However, deduplication may remove:
          - Common patterns that SHOULD be memorized (idiomatic code, best practices)
          - License-compliant templates (standard headers, boilerplate that includes attribution)

      - decision: "Filter auto-generated code (heuristics)"
        rationale: "Auto-generated code is robotic, low quality (skews model toward non-human patterns)"
        method: |
          Automated heuristics:
          - Files with "Generated by" comments
          - Protobuf, Thrift, YAML schema-generated code
          - Minified JavaScript (unreadable to humans)
          - High repetition (same line repeated 100+ times)
        data_removed: "Estimated 10-20% of files filtered as auto-generated"
        impact_on_inferences: |
          Improves model quality (more human-like code generation). But heuristic filter:
          - May miss some auto-generated code (false negatives)
          - May falsely exclude human-written repetitive code (false positives, e.g., test data arrays)

    synthetic_elements:
      present: false
      description: |
        Copilot training data is 100% real GitHub code (no synthetic generation).

        HOWEVER, GitHub repositories themselves may contain synthetic elements:
        - AI-generated code (GPT-3, earlier Copilot versions, other code generators published to GitHub 2020-2021)
        - Duplicated/plagiarized code (developers copy-paste from Stack Overflow, other repos)
        - Auto-generated code that passed heuristic filter (false negatives)

        Result: Copilot may be partially trained on PREVIOUS AI-generated code (model collapse risk, similar
        to Common Crawl 2020-2024 snapshots containing GPT-3 outputs).

    known_limitations:
      - limitation: "License distribution unknown (GitHub/OpenAI have not disclosed)"
        description: |
          % GPL vs MIT vs Apache vs BSD vs proprietary: UNKNOWN.

          Estimated from general GitHub surveys: ~15% GPL, ~45% MIT, ~15% Apache, ~10% BSD, ~15% no license.
          But Copilot-specific distribution NOT disclosed (trade secret?).

          CRITICAL for legal analysis: If >10% GPL, and Copilot outputs are "derivative works", then significant
          portion of Copilot usage violates GPL copyleft.
        severity: "critical"

      - limitation: "Cannot verify deleted repositories not included"
        description: |
          GitHub retains data after repository deletion (for abuse prevention, legal compliance).
          OpenAI/Microsoft have not confirmed whether deleted repos excluded from training data.

          If deleted repos included: Owners who deleted repos to prevent Copilot use were ineffective.
        severity: "medium"

      - limitation: "Private repository breach risk (GitHub denies, but unverified)"
        description: |
          In theory, only public repos used. But if bug/misconfiguration leaked private repos into training data:
          - Trade secrets revealed (proprietary algorithms)
          - Credentials leaked (API keys, passwords accidentally in private repos)

          GitHub denies this occurred, but independent verification impossible (training data not disclosed).
        severity: "high (if occurred)"

      - limitation: "Security vulnerability quantification incomplete"
        description: |
          Pearce et al. (2021): 40% of Copilot outputs contain vulnerabilities (89-scenario test).
          But study limited to Python, specific vulnerability types. Broader vulnerability rate: UNKNOWN.
        severity: "high"

      - limitation: "No ground truth for reproduction rate"
        description: |
          Nguyen & Nadi (2022): 0.1% reproduction rate (1 in 1,000 suggestions is verbatim copy).
          But study sampled ~10K suggestions. Actual reproduction rate across 1M+ users: UNKNOWN.

          If reproduction higher than measured, license violation rate correspondingly higher.
        severity: "high"

    access:
      public: false
      license: |
        Copilot training data: NOT publicly accessible (GitHub/OpenAI proprietary).
        Copilot model: Proprietary (Codex weights not released, unlike LLaMA/Falcon open source LLMs).

        CONTRAST WITH OPEN SOURCE: OSS maintainers create code → publish openly (MIT/GPL licenses) →
        Microsoft/GitHub train proprietary model on open code → sell closed tool ($10-19/month).

        ASYMMETRY: Open data → closed product. No reciprocity (OSS community gave code, gets nothing back).

      conditions: |
        Copilot access: $10/month (individual), $19/month (business), free for students/verified OSS maintainers.

        ToS: Users agree not to reverse-engineer Codex (protect model weights from extraction).

        NO requirement that users:
        - Respect licenses of training data (Copilot outputs may violate GPL, users not warned)
        - Attribute original authors (when Copilot reproduces code verbatim)
        - Conduct security review (40% of outputs vulnerable, no warning provided)

    attested_by:
      - name: "Asbjørn Ras"
        role: "analyst"
        affiliation: "Public Reason Project"
        date: "2026-04-07"
        statement: |
          This Layer 1 (Data Provenance) represents POST-HOC RECONSTRUCTION based on public sources:
          - Chen et al. (2021) "Evaluating Large Language Models Trained on Code" (OpenAI Codex paper)
          - Doe v. GitHub lawsuit filings (Nov 2022, class action by OSS developers)
          - Academic studies (Pearce et al. 2021, Nguyen & Nadi 2022, Niu et al. 2023)
          - GitHub blog posts (Copilot launch, ToS updates)

          GAPS: Microsoft/GitHub/OpenAI internal deliberations are NOT public. Rationales for decisions
          (include GPL code, strip license headers, no compensation, no opt-out) are INFERRED from
          circumstantial evidence but not officially documented.

          Accountability gaps marked "UNKNOWN" or "UNSTATED" indicate NO public record of decision-making
          process exists. This is ACCOUNTABILITY FAILURE, not incomplete research.

# ============================================================================
# LAYER 2: CONSEQUENCE SIMULATION
