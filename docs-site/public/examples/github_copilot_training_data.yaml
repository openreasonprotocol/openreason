        - Benefit: Maintainers benefit from tool built on their code (reciprocity)
        - IMPLEMENTED: GitHub offers free Copilot to verified OSS maintainers (2021-present)

        NOTE: Alternative C (freemium) implemented, but benefits INDIVIDUAL maintainers ($10/month value) not
