l4_accountability_ledger:

  constitutive_decisions:

    - id: "D1_no_license_filtering"
      decision_title: "Train on All Public GitHub Code (No License-Based Filtering)"
      decision_date: "2020-2021"
      decision_date_confidence: "medium"

      decision_makers:
        - entity: "OpenAI Engineering Team"
          role: "Model training methodology design"
          rationale: |
            OpenAI Codex team (Chen et al. 2021 authors) designed training data preprocessing pipeline.
            Technical decision to include all public code regardless of license (maximize training data size).

        - entity: "Microsoft Legal"
          role: "Legal risk assessment (inferred)"
          rationale: |
            UNKNOWN - no public record of Microsoft legal review of GPL copyleft implications.

            Either: (A) Legal assessed "fair use" defense strong (AI training = transformative use), OR
                    (B) Legal not consulted (engineering team made decision unilaterally), OR
                    (C) Legal advised against but overruled (business decision to accept lawsuit risk)

        - entity: "Satya Nadella (Microsoft CEO) and/or Kevin Scott (Microsoft CTO)"
          role: "Strategic approval (inferred)"
          rationale: |
            Copilot launch required C-suite approval (major product, $7.5B GitHub acquisition strategic asset).
            No public record of who approved Copilot's license-inclusive training approach.

      decision_description: |
        WHAT WAS DECIDED:
        Train OpenAI Codex on ALL public GitHub repositories (2008-2021), including GPL-licensed code (~15% of repos).

        NO license-based filtering implemented. GPL copyleft requirements (derivative works must be GPL-licensed) NOT
        honored. MIT/Apache attribution requirements (copyright notice preserved) NOT honored.

        ALTERNATIVES NOT CHOSEN:
        - Train only on permissively licensed code (MIT/Apache/BSD, exclude GPL) → eliminates copyleft risk
        - Train on all but preserve attribution (include original author/license when code reproduced)
        - Implement GPL-aware warning system (detect GPL-derived suggestions, warn users of license implications)

      rationale_stated: |
        UNSTATED - Microsoft/GitHub/OpenAI have not publicly disclosed why GPL code included.

        GitHub blog post (June 29, 2021, Copilot announcement): "Trained on billions of lines of public code"
        - Does NOT mention license filtering, GPL implications, or legal analysis
        - Implies "public code = fair game" (no license distinctions made)

      rationale_inferred: |
        POSSIBLE RATIONALES (not officially stated, inferred from business logic):

        1. MAXIMIZE TRAINING DATA SIZE (ML performance hypothesis):
           - More training data → better model performance (power law scaling)
           - GPL repos ~15% of total → excluding reduces training data 15%
           - Chen et al. (2021): 159GB Python code used → removing GPL = 135GB → estimated 10-20% performance drop
           - Business logic: Best model quality requires maximum data, license filtering hurts product

        2. "FAIR USE" LEGAL THEORY (copyright defense):
           - AI training = "transformative use" (like Google Books indexing)
           - Model learns PATTERNS not copies code verbatim (except 0.1% reproduction rate, Nguyen & Nadi 2022)
           - Fair use precedent: Authors Guild v. Google (2015) - scanning books for search fair use
           - Legal bet: Courts will rule AI training fair use, GPL copyleft doesn't apply

        3. CALCULATED LEGAL RISK (risk-reward calculation):
           - Lawsuit damages: $1-10B (if plaintiffs win)
           - Copilot revenue: $100M+/year × 10+ years = $1B+ lifetime value
           - Probability plaintiffs win: Estimated 30-50% (legal uncertainty)
           - Expected value: 50% × $5B = $2.5B lawsuit cost vs $1B+ revenue → negative ROI
           - BUT: If probability <20%, lawsuit risk worth taking for best-in-class model

        4. COMPETITIVE PRESSURE (first-mover advantage):
           - GitHub Copilot first major code AI (launched June 2021)
           - Competitors: Amazon CodeWhisperer (2022), Google Codey (2023), Meta Code Llama (2023)
           - First-mover captures market (1M+ users by 2023) → delaying for license compliance loses advantage
           - Business logic: Ship fast with legal risk vs ship slow with compliance (lose market)

      alternatives_considered: |
        UNKNOWN - no public documentation of alternatives considered.

        IF Microsoft/GitHub conducted ORP Layer 2 analysis (2020), would have evaluated:

        ALTERNATIVE A: License-Compliant Training (Permissive Only)
        - Exclude GPL (copyleft risk eliminated)
        - Train on MIT/Apache/BSD only (~85M repos vs 100M)
        - Performance: 10-20% lower (less training data)
        - Legal risk: $0 (no GPL violations)
        - Cost-benefit: $135M less revenue vs $2.5B lawsuit avoided = +$2.365B value

        ALTERNATIVE B: GPL-Aware Warning System
        - Train on all code (including GPL)
        - Implement GPL detection (fingerprint code snippets to identify GPL-derived suggestions)
        - Warn users: "This suggestion may be GPL-derived, using in proprietary code may violate license"
        - Legal risk: Reduced (demonstrates good faith, informed consent)
        - Cost: $1-5M (develop detection system)

        ALTERNATIVE C: Revenue Sharing (10% to OSS Maintainers)
        - Train on all code (including GPL)
        - Compensate maintainers ($10M+/year, proportional to repo usage)
        - Legal risk: Reduced (compensation demonstrates respect, may settle lawsuit for less)
        - Ecosystem: Sustainability improved (maintainers incentivized to contribute)
        - Cost: $90M over 9 years (10% revenue) vs $2B lawsuit reduction = +$1.91B value

        No evidence these alternatives formally evaluated. Decision appears ENGINEERING-DRIVEN (maximize data)
        not POLICY-DRIVEN (evaluate trade-offs, stakeholder impacts, legal risks).

      consequences:
        intended:
          - "Best-in-class model performance (Codex 12B trained on maximum data, 159GB Python + billions more lines other languages)"
          - "First-mover advantage (Copilot launched June 2021, competitors 1-2 years behind)"
          - "1M+ users by 2023 (market leadership in AI pair programming)"

        unintended:
          - "Doe v. GitHub lawsuit (Nov 2022, $1-10B damages claimed by 9,000+ OSS developers)"
          - "OSS community backlash (maintainers see licenses ignored, labor exploited, trust eroded)"
          - "Proprietary software companies at legal risk (if Copilot violates GPL, derivative software tainted)"
          - "Security vulnerability propagation (40% of suggestions contain exploitable flaws, Pearce et al. 2021)"

        harms_by_tier:
          - tier: "TIER 2 - LEGAL"
            description: "GPL copyleft violations, DMCA § 1202 (license header removal), MIT/Apache attribution violations"
            affected_population: "1.5M GPL authors, 7M permissive license authors, 100K+ businesses using Copilot for proprietary software"
            severity: "critical ($1-10B lawsuit damages pending)"

          - tier: "TIER 3 - ECONOMIC"
            description: "OSS maintainers zero compensation despite $100M+ Copilot revenue (labor exploitation)"
            affected_population: "10 million OSS developers whose code is training data"
            severity: "high (unfair value distribution, asymmetric wealth transfer)"

          - tier: "TIER 4 - ECOSYSTEM"
            description: "Open source sustainability crisis (maintainer burnout, Faker.js/Left-pad incidents, contribution drop)"
            affected_population: "OSS ecosystem (10M maintainers + 100M future developers dependent on OSS)"
            severity: "high (long-term existential risk to OSS, vicious cycle)"

      accountability_gap: |
        COMPLETE ACCOUNTABILITY FAILURE - Most legally consequential decision, yet ZERO public documentation:

        UNKNOWN:
        - WHO decided (which individual or committee authorized GPL-inclusive training?)
        - WHAT alternatives considered (was license-compliant training evaluated?)
        - WHY decision made (maximize data? fair use bet? competitive pressure?)
        - WHAT legal analysis conducted (did Microsoft legal review GPL implications?)
        - WHEN decided (2020? 2021? before or after Codex training began?)

        ACCOUNTABILITY MECHANISMS ABSENT:
        - No decision log (when, who, why, what alternatives)
        - No cost-benefit analysis (legal risk vs performance trade-off)
        - No stakeholder consultation (OSS maintainers not consulted, licenses ignored)
        - No transparency (Copilot announcement does not disclose GPL-inclusive training)

        THIS IS WHY ORP EXISTS:
        Layer 4 would REQUIRE constitutive legal decisions be logged BEFORE deployment, with:
        - Decision makers identified (individuals, not "OpenAI/Microsoft" as black box)
        - Rationales documented (stated reason for GPL inclusion)
        - Alternatives evaluated (license-compliant training, GPL warnings, revenue sharing)
        - Cost-benefit analysis (legal risk quantified, stakeholder harms weighed)
        - Stakeholder consultation (OSS maintainers given voice, informed consent)

        If Layer 4 existed in 2020, Microsoft/GitHub could not launch Copilot without documenting:
        "We chose to include GPL code despite $1-10B lawsuit risk because [RATIONALE], considered [ALTERNATIVES],
        consulted [STAKEHOLDERS], and determined [COST-BENEFIT]."

        RESULT: Either (A) rational analysis shows license compliance superior → GPL excluded, OR
                        (B) irrational analysis exposed → public pressure prevents launch, OR
                        (C) Microsoft proceeds but accepts documented accountability → easier to litigate later

    - id: "D2_strip_license_headers"
      decision_title: "Strip License Headers from Training Data (DMCA § 1202 Violation)"
      decision_date: "2020-2021"
      decision_date_confidence: "high"

      decision_makers:
        - entity: "OpenAI Codex Engineering Team"
          role: "Training data preprocessing pipeline"
          rationale: |
            Standard ML preprocessing: Remove boilerplate (comments, license headers, whitespace) to focus on
            functional code. Chen et al. (2021) does not explicitly state license headers removed, but Nguyen &
            Nadi (2022) study demonstrates Copilot outputs lack attribution even when reproducing verbatim code.

      decision_description: |
        WHAT WAS DECIDED:
        Strip license headers (copyright notices, license text) from code files during preprocessing.

        LICENSE HEADERS TYPICALLY CONTAIN:
        - Copyright notice: "Copyright (c) 2020 Author Name"
        - License type: "Licensed under MIT License" or "This program is GPL..."
        - Attribution requirement: "The above copyright notice shall be included in all copies"

        RESULT:
        Copilot training data loses license information. Model cannot attribute original authors when reproducing
        code (even 0.1% verbatim reproduction, Nguyen & Nadi 2022, lacks attribution).

      rationale_stated: |
        UNSTATED - OpenAI has not publicly explained why license headers stripped.

      rationale_inferred: |
        STANDARD ML PREPROCESSING (most likely):
        - License headers are boilerplate, not functional code
        - Including headers wastes training tokens (model should learn code PATTERNS not legal text)
        - Comment removal standard practice (code-only training improves model focus)

        PRECEDENT: ImageNet (2009), LAION-5B (2022) also removed metadata (photographer credits, EXIF data).
        Pattern: ML teams prioritize TECHNICAL QUALITY (model performance) over LEGAL COMPLIANCE (attribution).

      alternatives_considered: |
        UNKNOWN - no public documentation.

        ALTERNATIVE A: Preserve License Headers
        - Keep copyright notices in training data
        - Model learns to reproduce attribution (when code reproduced verbatim, includes "// Copyright (c) X")
        - Cost: Minimal (license headers ~5-10 lines per file, <1% of total tokens)
        - Benefit: DMCA § 1202 compliance, MIT/Apache attribution preserved

        ALTERNATIVE B: Separate Attribution Layer
        - Strip headers during training (maximize model quality)
        - Build separate database mapping code snippets → original authors/licenses
        - When Copilot reproduces code, lookup attribution and display to user
        - Cost: $5-10M (build attribution database, integrate into Copilot UI)
        - Benefit: Best model quality + legal compliance

      consequences:
        intended:
          - "Improved model quality (no wasted tokens on legal boilerplate)"
          - "Cleaner training data (code-only, no comments/headers)"

        unintended:
          - "DMCA § 1202 violations (removing copyright management information prohibited by law)"
          - "MIT/Apache attribution violations (licenses require copyright notice preserved)"
          - "Doe v. GitHub lawsuit claim: 'GitHub stripped our copyright notices, violating DMCA'"
          - "OSS maintainers see code reproduced WITHOUT attribution (disrespect, invisible labor)"

        harms_by_tier:
          - tier: "TIER 2 - LEGAL"
            description: "DMCA § 1202 violation (removing copyright management information), MIT/Apache attribution requirement violated"
            affected_population: "7M permissive license authors (MIT/Apache/BSD require attribution)"
            severity: "high (statutory damages $2,500-$25,000 per violation × thousands of works)"

      accountability_gap: |
        MINIMAL ACCOUNTABILITY:

        KNOWN:
        - WHO: OpenAI Codex engineering team (standard preprocessing decision)
        - WHAT: License headers removed (confirmed by Nguyen & Nadi 2022 study showing no attribution in outputs)

        UNKNOWN:
        - WHY: Was legal compliance considered? Did Microsoft legal review DMCA § 1202 implications?
        - WHAT alternatives: Was preserving attribution discussed?

        PROBLEM: Decision made by ENGINEERING team (optimize model) not LEGAL/POLICY team (ensure compliance).
        No evidence legal consulted before stripping copyright notices.

        ORP WOULD REQUIRE: Layer 4 documentation of WHY license headers removed, WHAT legal analysis conducted,
        WHAT alternatives considered (preserve headers, separate attribution layer).

