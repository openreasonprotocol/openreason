l3_empathy_mapping:

  stakeholder_groups:

    - id: "microsoft_github"
      name: "Microsoft/GitHub (Revenue Capturer)"
      description: |
        Microsoft acquired GitHub for $7.5B (2018), launched Copilot (2021). Microsoft owns OpenAI partnership
