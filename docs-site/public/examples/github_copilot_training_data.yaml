        - "Reputation damage: OSS community sees Microsoft as exploiting free labor, ignoring licenses"
        - "Regulatory risk: EU AI Act may require license compliance, transparency"
      net_welfare: "strongly positive (benefits >> harms unless lawsuit lost fully)"
      notes: |
        Only stakeholder group with 100% governance power. All constitutive decisions (include GPL, strip
        license headers, no compensation, no opt-out) made by Microsoft/GitHub affecting 10M+ OSS maintainers.

    - id: "oss_maintainers"
      name: "Open Source Maintainers (ABSENT NODE, TIER 3 ECONOMIC HARM)"
      description: |
        10 million active OSS developers on GitHub whose code is Copilot training data. Includes maintainers of
        popular projects (React, Django, NumPy, TensorFlow) and millions of smaller projects.
      representation_in_decision_making: "zero"
      population_size: "10 million OSS developers"
      stakeholder_power: "none"
      benefits:
        - "Copilot free for verified OSS maintainers (GitHub policy, $10/month value)"
        - "Increased project visibility (Copilot may suggest their code, indirect attribution)"
      harms:
        - "TIER 3 ECONOMIC: Zero compensation despite code being $100M+ revenue training data (labor exploitation)"
        - "TIER 2 LEGAL: Licenses violated (GPL copyleft ignored, MIT/Apache attribution stripped)"
        - "TIER 3 CONSENT: Code used without notification (many maintainers unaware until Copilot launch 2021)"
        - "Sustainability crisis: Unpaid labor commercially exploited → burnout → Faker.js/Left-pad incidents"
        - "No control: Cannot opt-out, cannot demand attribution, cannot receive compensation"
      net_welfare: "strongly negative"
      harm_severity: "TIER 2 LEGAL + TIER 3 ECONOMIC + TIER 4 ECOSYSTEM"
      vulnerable_population_flags:
        - "LABOR EXPLOITATION: 10 million developers, decades of unpaid labor, $0 from $100M+ Copilot revenue"
        - "LICENSE VIOLATIONS: GPL copyleft ignored, MIT/Apache attribution stripped (DMCA § 1202)"
        - "BURNOUT RISK: Faker.js/Left-pad pattern - maintainers delete projects when exploitation becomes visible"
      notes: |
        CRITICAL ABSENT NODE: Largest affected population (10M developers), zero governance representation.

        MINORITY STRESS TEST: FAILED
        - Vulnerable population (unpaid OSS maintainers) bears highest harm (economic exploitation, legal violations)
        - For benefit of privileged corporation (Microsoft $3T market cap, $100M+ Copilot revenue)
        - Violates Rawlsian justice: Worst-off (maintainers) harmed for best-off (Microsoft) benefit

        ORP'S VALUE: Layer 3 empathy mapping in 2020 would have identified OSS maintainers as absent node
        BEFORE Copilot launch. Minority stress test would trigger: "If worst-off bear economic exploitation +
        legal violations, reconsider constitutive decision." Result: License compliance + revenue sharing
        implemented BEFORE lawsuit + community backlash.

