    LAYER 5 KEY FINDINGS:

    1. THREE FORKS DEMONSTRATE FEASIBLE ALTERNATIVES:
       - F1 (License-Compliant): +$2.36B value vs S1 (legal risk eliminated)
       - F2 (Revenue-Sharing): +$1.9B value vs S1 (legal + ecosystem benefits)
       - F3 (Open Source): Ethical optimal, commercial suboptimal ($720M foregone but community alignment)

    2. S1 (ACTUAL) IS DOMINATED BY F1 AND F2:
       - F1: Strictly superior under any lawsuit probability >5% (saves $2.36B for $135M cost)
       - F2: Superior under ethical framework (fair compensation, 90% profit retained)
       - S1: Only optimal if lawsuit probability <5% AND zero ethical weight on maintainer compensation

    3. FORK FEASIBILITY:
       - F1: Technically trivial ($3-5M retraining, license filtering already exists)
       - F2: Technically moderate ($7-13M attribution system, Sponsors integration exists)
       - F3: Technically trivial ($500K model release, governance model exists - Linux Foundation, PSF)
       - Barriers: Not technical, but BUSINESS DECISION (profit maximization vs ethical considerations)

    4. COUNTERFACTUAL VALUE OF ORP:
       If Microsoft/GitHub documented Layer 5 (2020) showing F1/F2 superior to S1:
       - EITHER: Rational decision → implement F1/F2 (avoid $1-10B lawsuit, maintain profit)
       - OR: Irrational decision exposed → public pressure forces F1/F2 (cannot hide dominated choice)
       - OR: Proceed with S1 but documented → easier to hold accountable (knew alternatives, chose worse)

    5. POST-HOC IMPOSSIBILITY:
       F1 (License-Compliant) CANNOT be implemented post-launch:
       - Codex already trained on GPL code (2020-2021) → cannot "un-train"
       - 1M+ users already using Copilot (2021-2024) → 3+ years of GPL-derived outputs in production
       - Retraining from scratch costs $10-50M + 6-12 months → Microsoft unlikely to do post-hoc

       Result: S1 locked in PERMANENTLY once deployed (June 2021). Fork opportunities existed ONLY pre-deployment.

    6. IRREVERSIBILITY DEMONSTRATES ORP'S VALUE:
       This is EXACTLY why Layer 5 must exist BEFORE deployment:
       - Pre-deployment: F1/F2 cost $3-13M, prevent $1-10B lawsuit → rational to fork
       - Post-deployment: Switching to F1/F2 costs $50-100M (retrain, migrate users) → irrational, stuck with S1
       - ORP Layer 5 (2020): Would force documentation of forks, expose S1 as dominated choice
       - Result: Either rational fork decision (F1/F2), or S1 accountability established (knew better alternatives existed)

