l2_consequence_simulation:

  affected_population:
    description: |
      OPEN SOURCE ECOSYSTEM + AI DEVELOPER COMMUNITY (2021-present):
      - 10 million OSS maintainers (code creators, training data source)
      - 1+ million Copilot users (developers using AI pair programming)
      - 100,000+ businesses using Copilot Business
      - Microsoft/GitHub (revenue capturer, $100M+/year from Copilot)
      - Future developers (100M+ by 2030 who will learn coding with AI assistance)

      HARM DISTRIBUTION:
      - LEGAL: GPL violations affect proprietary software companies using Copilot ($1-10B lawsuit damages)
      - ECONOMIC: OSS maintainers bear labor exploitation (10M developers, $0 compensation)
      - ECOSYSTEM: Open source sustainability crisis (if maintainers stop contributing, AI training data degrades)

    size_estimate: "110+ million people (10M OSS maintainers + 100M future developers + 1M current users)"
    size_confidence: "high"

    geographic_distribution: |
      GLOBAL (OSS community worldwide, Copilot available in 180+ countries)

      WESTERN-DOMINATED (in practice):
      - 60% OSS maintainers US/EU
      - 80% Copilot users US/EU (English-language tool, Western developer market)
      - Microsoft/GitHub: US-based (Redmond, WA / San Francisco, CA)

    temporal_scope:
      start: "2021-06"
      end: "2030 (projected)"
      duration: "9 years (Copilot launch to projected ecosystem impact maturity)"

  model:
    description: |
      OPEN SOURCE ECOSYSTEM SUSTAINABILITY MODEL:

      This model simulates how Copilot's constitutive decisions (2020-2021) affect open source ecosystem
      sustainability (2021-2030) through feedback loops:

      MECHANISM:
      1. OSS maintainers create code → publish openly (MIT/GPL licenses) →
      2. Microsoft/GitHub train Copilot on OSS code (no compensation, licenses ignored) →
      3. Copilot generates $100M+/year revenue → Microsoft captures 100%, OSS maintainers 0% →
      4. Maintainers see labor exploited + licenses violated → resentment + burnout →
      5. Contribution drops (Faker.js incident, Left-pad, maintainer strikes) →
      6. Less new OSS code created → Copilot training data quality stagnates →
      7. Copilot performance degrades → Microsoft forced to compensate or ecosystem collapses

      COUNTERFACTUAL SCENARIOS:
      We model 4 scenarios (2021-2030) based on Copilot's constitutive decisions:
      - S1: Actual (no license compliance, no compensation) → $1-10B lawsuit, ecosystem crisis, maintainer burnout
      - S2: License-compliant (permissive only) → legal risk eliminated, 10-20% performance cost, OSS trust maintained
      - S3: Revenue sharing (10% to maintainers) → sustainability improved, lawsuit risk reduced, 90% profit margin retained
      - S4: Open source Codex → community controls tool, no single entity liable, alignment of interests

      CRITICAL VARIABLES:
      - license_filtering_policy: "none" → $1-10B lawsuit; "permissive_only" → legal risk eliminated
      - revenue_sharing_percentage: 0% → maintainer burnout; 10% → sustainability improved

    type: "System dynamics model (feedback loops, ecosystem sustainability)"

    assumptions:
      - assumption: "GPL copyleft applies to AI training (Copilot outputs are derivative works)"
        confidence: "medium"
        sensitivity: "critical"
        evidence: |
          LEGAL UNCERTAINTY: Courts have not ruled on whether AI training creates "derivative works" under
          copyright law. Two interpretations:

          (A) Fair use: AI training is transformative use (like Google Books), outputs are new works not derivatives
          (B) Derivative work: Training creates derivative model, outputs inherit license obligations

          Doe v. GitHub (2022) proceeding on theory (B). If courts rule (A), lawsuit fails; if (B), $1-10B damages.
        notes: |
          Mark MEDIUM confidence - legal uncertainty. But CRITICAL sensitivity - if (B) correct, GPL violations
          affect ALL Copilot users creating proprietary software (massive liability).

      - assumption: "OSS maintainer contribution drops when labor commercially exploited without compensation"
        confidence: "high"
        sensitivity: "high"
        evidence: |
          Historical examples:
          - Faker.js (Jan 2022): Maintainer deleted library after seeing Fortune 500 using free labor
          - Left-pad (2016): Maintainer removed 11-line package, broke thousands of projects
          - OpenSSL post-Heartbleed (2014): Donations increased 100x after crisis, demonstrating prior underfunding

          Eghbal (2020) "Working in Public": OSS maintainers burn out without compensation, especially when
          commercial exploitation visible (Copilot $100M+ revenue, maintainers $0).

      - assumption: "10% revenue sharing improves OSS sustainability without significantly reducing Microsoft profit"
        confidence: "high"
        sensitivity: "high"
        evidence: |
          Math: Copilot revenue $100M+/year → 10% = $10M/year to OSS maintainers
          - Microsoft retains 90% profit margin ($90M+/year)
          - OSS maintainers receive meaningful support ($10M distributed across ~1M active contributors = ~$10/contributor/year or concentrated on popular projects)
          - GitHub Sponsors currently ~$100M/year total → Copilot 10% would add $10M (10% increase)

      - assumption: "License-compliant training (permissive only) reduces model performance 10-20%"
        confidence: "medium"
        sensitivity: "medium"
        evidence: |
          Estimate based on: ~15% GPL repos → excluding reduces training data 15% → performance scales with data (power law).
          Chen et al. (2021) Codex trained on 159GB Python → removing 15% = 135GB → estimated 10-20% performance drop.

          Mark MEDIUM confidence - no empirical testing of license-filtered Codex exists.

      - assumption: "Open source Codex (release model weights) eliminates lawsuit risk but foregoes $100M+ revenue"
        confidence: "high"
        sensitivity: "high"
        evidence: |
          Precedent: LLaMA (Meta 2023), Falcon (TII 2023), BLOOM (BigScience 2022) - open source LLMs released.
          Legal risk: Distributed liability (no single entity controls open model) vs concentrated (Microsoft liable for Copilot).
          Revenue: Open source → $0 subscription revenue (but goodwill, developer ecosystem benefits).

