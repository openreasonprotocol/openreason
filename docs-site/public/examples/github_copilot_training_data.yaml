      rationale_stated: |
        UNSTATED - Microsoft/GitHub have not publicly explained why OSS maintainers not compensated.

        GitHub position (inferred from blog posts, interviews): "Public code is public, no legal obligation to compensate."

      rationale_inferred: |
        POSSIBLE RATIONALES:

        1. NO LEGAL OBLIGATION:
           - OSS licenses (MIT/Apache/BSD) allow commercial use without payment requirement
           - "Public code = public good" logic (no expectation of compensation)
           - GitHub ToS (pre-2021): "Public repositories... allow others to view and fork" (no AI training mentioned)

