        - TIER 5 - BIAS: Model performance degradation (Stable Diffusion worse at non-Western cultural contexts)
        - TIER 3 - ETHICAL: Cultural erasure (Western aesthetic norms encoded as "default" in AI models)
        - TIER 4 - ECONOMIC: Competitive disadvantage (Western companies train better models on Western data)

      representation_gap: SEVERE (80% of global population, <20% of dataset by estimate)
      harm_severity: TIER 5 - BIAS (demographic), TIER 3 - ETHICAL (cultural)

      notes: |
        Common Crawl (LAION-5B source) is English-heavy, Western-heavy due to:
        1. English-language web larger and better crawled (Google indexing bias)
        2. Web infrastructure concentrated in Global North (server locations, CDN performance)
        3. CLIP filtering (OpenAI CLIP trained on English captions → LAION-5B inherits bias)

        Consequence: Stable Diffusion prompts like "a beautiful wedding" default to Western white weddings,
        not Indian, Nigerian, or Chinese wedding traditions. "Professional attire" defaults to Western
        business suits, not saris, dashikis, or other cultural norms.

  # ---------------------------------------------------------------------------
  # Minority Stress Test
  # ---------------------------------------------------------------------------
  minority_stress_test:
    test_description: |
      Evaluate whether LAION-5B's constitution disproportionately harms minority or vulnerable groups
      relative to majority/privileged groups. Focus on groups with <10% representation in governance
      despite >10% stake in outcomes.

    vulnerable_populations_identified:
      - group: CHILDREN DEPICTED IN CSAM (SG5)
        representation: 0% (absolute absence, cannot consent)
        stake: 100% of harm (Tier 1 - criminal/safety)
        disparity: EXTREME (zero voice, maximum harm)
        remedy_available: None (federated structure prevents image removal, only URL delisting)
        stress_test_result: FAILED - Constitutive decision (no CSAM filtering) imposed irreversible Tier 1 harm on legally protected class with zero representation

      - group: MEDICAL PATIENTS (SG6)
        representation: 0% (unaware of inclusion)
        stake: High (HIPAA violations, privacy, dignity)
