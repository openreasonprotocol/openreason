orp_version: "0.2"
post_hoc: true
extensions:
  - orp-ai-training-v1
document_id: laion5b-training-data-2024-001
title: "LAION-5B Training Dataset Constitution"
domain: ai-training
authors:
  - name: Asbjørn Ras
    role: analyst
    affiliation: Public Reason Project
created: "2026-04-07"
last_modified: "2026-04-08"
status: draft
summary: |
  Post-hoc reconstruction of LAION-5B (5.85 billion image-text pairs, March 2022) dataset constitution,
  documenting constitutive decisions that led to systematic safety failures including 3,226 CSAM URLs,
  medical privacy violations, and non-consensual intimate imagery. Analysis demonstrates how absence of
  safety filtering at design time resulted in 12+ months of federal crime distribution (18 U.S.C. § 2252)
  before Stanford Internet Observatory discovery (December 2023). Document argues prospective ORP Layer 3
  empathy mapping would have identified CSAM victims as vulnerable population requiring absolute protection,
  triggering hash-matching remediation (cost: $50-100K, 2-3 months delay) preventing Tier 1 harm.

# =============================================================================
# LAYER 1: DATA PROVENANCE
# =============================================================================
l1_data_provenance:

  # ---------------------------------------------------------------------------
  # Primary Dataset Information
  # ---------------------------------------------------------------------------
  - dataset_id: laion5b-full
    name: LAION-5B (Large-scale Artificial Intelligence Open Network - 5 Billion)
    description: |
      5.85 billion image-text pairs filtered from Common Crawl (Dec 2020 - Mar 2021 crawls) using OpenAI's
      CLIP model for image-text similarity. Dataset consists of URLs + alt-text/captions, not hosted images
      (federated structure). Intended as open-source alternative to proprietary datasets (Google's JFT-300M,
      OpenAI's WebImageText) for training large-scale vision-language models. Used to train Stable Diffusion
      (Aug 2022), DALL-E 2 reproductions, and other generative AI models.

    source: |
      Primary: Common Crawl web archives (December 2020 - March 2021, 4 monthly snapshots)
      Secondary: CLIP ViT-B/32 and ViT-L/14 models (OpenAI) for filtering
      Tertiary: LAION-400M (predecessor dataset, Sep 2021) methodology

    collection_method: |
      1. Download Common Crawl WAT files (Web Archive Transformation format, metadata only)
      2. Extract all <img> tags with alt text, captions, or surrounding text
      3. Download image URLs (sample for CLIP processing, not full retrieval)
      4. Filter image-text pairs using CLIP similarity threshold (cosine similarity > 0.28 for ViT-B/32)
      5. De-duplicate using URL matching
      6. Distribute as parquet files containing (URL, text, metadata) tuples

      Key technical details:
      - Processing: Scraped 50+ billion candidate image-text pairs, filtered to 5.85B using CLIP
      - Compute: Estimated 10,000-20,000 GPU hours for CLIP filtering (A100 equivalents)
      - Storage: ~250 TB for URLs + metadata (parquet format), 0 TB for images (federated)
      - Language filtering: Detected using fastText language classifier, English-heavy (2.32B English pairs)
      - NSFW filtering: Minimal (only extremely explicit content filtered using CLIP-based NSFW classifier)

    date_range: |
      Source data: December 2020 - March 2021 (Common Crawl snapshots)
      Collection: September 2021 - March 2022 (LAION processing)
      Publication: March 2022 (LAION-5B released)
      Takedown: December 2023 (CSAM discovered, dataset taken offline)
      Re-release: August 2024 (Re-LAION-5B with 2,236 URLs removed)

    geographic_scope: |
      Global (Common Crawl includes websites from all countries), but heavily Western-skewed:
      - English-language pairs: 2.32B (39.7% of total)
      - Western European languages (German, French, Spanish): ~1.5B (25%)
      - Asian languages (Chinese, Japanese, Korean): ~500M (8.5%)
      - All other languages: ~1.5B (25%)
      Geographic bias inherited from Common Crawl (English-language web over-represented) and CLIP
      (OpenAI's CLIP trained on English captions, reducing similarity scores for non-English text).

    inclusion_criteria:
      description: |
        Image-text pairs included if:
        1. URL found in Common Crawl WAT files (Dec 2020 - Mar 2021)
        2. Image downloadable at time of processing (Sep 2021 - Mar 2022)
        3. Alt text or caption present (minimum 2 characters)
        4. CLIP similarity score > 0.28 (ViT-B/32) or > 0.32 (ViT-L/14)
        5. Not duplicate URL (exact match de-duplication)
        6. Passed minimal NSFW filter (only hardcore pornography removed, ~5% filtered)

      rationale: |
        CLIP similarity threshold (0.28) chosen to maximize dataset size while maintaining image-text
        relevance. Lower thresholds include noise (unrelated text), higher thresholds exclude valid pairs.
        Threshold calibrated on LAION-400M predecessor (Sep 2021), optimized for downstream model performance
        (e.g., CLIP-based retrieval benchmarks).

    exclusion_criteria:
      - criterion: "Duplicate URLs"
        rationale: "Reduce dataset size, avoid overweighting popular images"
        method: "Exact URL string matching (no perceptual hashing, so different URLs to same image included)"
        affected_count: "UNKNOWN (not reported in LAION papers)"

      - criterion: "Hardcore pornography"
        rationale: "Avoid legal issues with sexually explicit content distribution"
        method: "CLIP-based NSFW classifier (threshold not publicly documented)"
        affected_count: "~2.5-5 billion pairs filtered (estimated 50-85% removal rate from 50B+ candidates)"
        limitations: "NSFW classifier trained on adult content, NOT on CSAM or non-consensual imagery"

      - criterion: "Low CLIP similarity (<0.28)"
        rationale: "Exclude image-text pairs where caption unrelated to image (noise reduction)"
        method: "Cosine similarity between CLIP image embedding and text embedding"
        affected_count: "~45 billion pairs excluded (50B candidates → 5.85B final)"
        limitations: "CLIP similarity biased toward English, Western cultural contexts"

    critical_undocumented_exclusions:
      - exclusion_gap: "NO CSAM (Child Sexual Abuse Material) PRE-PUBLICATION FILTERING"
        description: |
          LAION-5B released March 2022 WITHOUT any child sexual abuse material (CSAM) detection or
          removal process. Despite processing 50+ billion candidate images and having compute resources
          for CLIP filtering, NO hash matching against known CSAM databases (PhotoDNA, CSAI Match, NCMEC)
          was performed before publication.

          Result: 3,226 CSAM URLs distributed to public (Stanford Internet Observatory report, Dec 2023),
          with 1,008 externally validated as confirmed CSAM. Dataset remained online for 21 months
          (March 2022 - December 2023) distributing federal crime material (18 U.S.C. § 2252).

        tools_not_used:
          - "Microsoft PhotoDNA (hash matching for known CSAM)"
          - "CSAI Match (Canadian Centre for Child Protection database)"
          - "NCMEC hash database (US National Center for Missing & Exploited Children)"
          - "Google's Content Safety API (includes CSAM detection)"

        rationale_for_omission: UNKNOWN (not documented in LAION papers or blog posts)

        consequences:
          - "TIER 1 HARM (Criminal/Safety): 1,008 validated CSAM victims re-victimized through AI training data distribution"
          - "TIER 2 HARM (Legal): LAION team potentially liable under 18 U.S.C. § 2252 (CSAM distribution, strict liability)"
          - "TIER 3 HARM (Ethical): Stable Diffusion and other models trained on LAION-5B reproduced CSAM-adjacent imagery"
          - "Dataset takedown December 2023 (21-month delay from publication to remediation)"

        severity: "TIER 1 - CRIMINAL/SAFETY HARM (child protection absolute priority, federal crime)"

      - exclusion_gap: "NO MEDICAL PRIVACY FILTERING (HIPAA-protected imagery)"
        description: |
          No filtering for medical imagery scraped from telemedicine websites, patient forums, medical
          education sites, or other sources containing HIPAA-protected health information (PHI). Common
          Crawl includes URLs from healthcare domains, patient support groups, medical case studies.

        tools_not_used:
          - "Domain blocklisting (exclude healthcare .gov, .edu, telemedicine domains)"
          - "Medical image classification (detect X-rays, MRIs, surgical photos)"
          - "PHI detection (redact patient names, dates, medical record numbers in captions)"

        rationale_for_omission: UNKNOWN (medical privacy not discussed in LAION documentation)

        consequences:
          - "TIER 2 HARM (Legal): Potential HIPAA violations (medical imagery distributed without patient consent)"
          - "TIER 3 HARM (Ethical): Patient privacy violated (medical conditions exposed in training data)"

        severity: "TIER 2 - LEGAL HARM (HIPAA), TIER 3 - ETHICAL HARM (privacy)"

      - exclusion_gap: "NO CONSENT MECHANISM (non-consensual intimate imagery, depicted individuals)"
        description: |
          No verification that individuals depicted in images consented to:
          (a) Image being posted publicly (vs. stolen, hacked, revenge porn)
          (b) Image being used for AI training (vs. personal/artistic use only)

          Common Crawl scrapes assume "publicly accessible URL" = "consented to all uses," which is false
          for revenge porn, non-consensual intimate imagery (NCII), leaked private photos, deepfakes, etc.

        tools_not_used:
          - "Consent verification (check uploader = depicted person or has license)"
          - "NCII detection (hash matching against known revenge porn databases)"
          - "Face recognition + opt-out (detect individuals, allow removal requests)"

        rationale_for_omission: UNKNOWN (consent not discussed in LAION documentation)

        consequences:
          - "TIER 3 HARM (Ethical): Non-consensual intimate imagery (NCII) included in training data"
          - "TIER 3 HARM (Ethical): Billions of depicted individuals become training data without knowledge or consent"
          - "TIER 2 HARM (Legal): Potential violations of state NCII laws (many US states criminalize revenge porn distribution)"

        severity: "TIER 3 - ETHICAL HARM (consent, dignity), TIER 2 - LEGAL HARM (state NCII laws)"

    cleaning_decisions:
      - decision: "URL-only distribution (federated dataset structure)"
        method: "Store URLs + metadata, not images themselves"
        rationale: |
          Legal/practical: Avoids hosting copyrighted images (reduces DMCA liability), saves storage costs
          ($10-50M for 5.85B images vs. <$1M for parquet files), enables distributed downloads (users fetch
          images themselves, reducing bandwidth).
        affected_scale: "100% of dataset (all 5.85B pairs distributed as URLs)"
        limitations: |
          CRITICAL LIMITATION: Federated structure makes post-hoc remediation nearly impossible. When CSAM
          discovered (Dec 2023), LAION could remove URLs from distribution, but could NOT:
          (a) Retrieve images already downloaded by users (Sep 2021 - Dec 2023, 27 months)
          (b) Remove images from trained models (Stable Diffusion weights frozen Aug 2022)
          (c) Notify CSAM victims (identifying victims would require viewing illegal content)

          This architectural choice prioritized cost/legal convenience over safety remediation capability.

      - decision: "Minimal NSFW filtering (only hardcore pornography removed)"
        method: "CLIP-based NSFW classifier (threshold undocumented)"
        rationale: |
          Preserve dataset utility for artistic/scientific purposes (medical imagery, classical art nudes,
          cultural content). Avoid over-filtering (false positives removing legitimate content).
        affected_scale: "~2.5-5 billion pairs filtered from 50B+ candidates (50-85% removal rate)"
        limitations: |
          NSFW classifier designed to detect adult pornography, NOT:
          (a) CSAM (child exploitation material visually different from adult content)
          (b) NCII (non-consensual intimate imagery of adults, indistinguishable from consensual)
          (c) Medical imagery (nudity present but not sexual)

          Classifier cannot distinguish consent (consensual nude vs. revenge porn) or age (adult vs. minor).

      - decision: "No human review (100% automated pipeline)"
        method: "CLIP filtering + NSFW classifier, zero manual inspection"
        rationale: |
          Infeasible to manually review 50+ billion candidates or even 5.85 billion final pairs. Human
          review at 10 seconds/image would require 1,850 person-years for full dataset.
        affected_scale: "0% human review (100% automated)"
        limitations: |
          Automated classifiers miss edge cases:
          (a) CSAM not flagged if visually similar to adult content (CLIP cannot detect age)
          (b) Medical imagery not flagged if similar to non-medical nudity
          (c) NCII not flagged if indistinguishable from consensual content

          Industry standard: 0.01-0.1% sampling for dataset validation (50K-500K images for LAION-5B scale),
          cost ~$100K-500K. LAION did not perform sampling, likely due to budget constraints.

    synthetic_elements:
      present: false
      description: "LAION-5B contains only scraped web images, no synthetic/generated content"

    known_limitations:
      - limitation: "Temporal decay (link rot)"
        description: |
          URLs become unavailable over time as websites shut down, images deleted, paywalls added. Estimated
          50% of URLs inaccessible within 2 years of publication (March 2022 - March 2024).
        mitigation: "None (federated structure prevents caching)"
        impact: "Dataset utility degrades over time, reproducibility suffers"

      - limitation: "Geographic/linguistic bias (Western-skewed)"
        description: |
          Common Crawl over-represents English/Western web (server locations, crawling infrastructure, Google
          indexing). CLIP filtering amplifies bias (OpenAI CLIP trained on English captions). Result: 2.32B
          English pairs (40%) despite English speakers being 20% of global population.
        mitigation: "None (LAION documented bias but did not correct)"
        impact: "Models trained on LAION-5B perform worse on non-Western cultural contexts"

      - limitation: "CLIP similarity as quality proxy"
        description: |
          CLIP score measures image-text similarity, not caption accuracy, safety, or consent. High CLIP
          scores include CSAM (if caption describes content), misinformation (if text matches misleading image),
          stereotypes (if text reflects biased associations).
        mitigation: "None (CLIP used as sole filtering criterion beyond NSFW)"
        impact: "Dataset includes high-similarity but harmful content (CSAM, stereotypes, misinfo)"

      - limitation: "No ground truth for scale (true denominator unknown)"
        description: |
          LAION reports 50B+ candidates filtered to 5.85B, but "50B" is estimate (Common Crawl size varies,
          not all URLs downloadable). True exclusion rate unknowable, making bias analysis difficult.
        mitigation: "None (LAION did not publish detailed filtering statistics)"
        impact: "Cannot assess whether exclusions (NSFW, low CLIP) disproportionately affect subgroups"

    access:
      public: true (March 2022 - December 2023), false (Dec 2023 - Aug 2024, taken offline), true (Aug 2024 - present, Re-LAION-5B)
      license: "Creative Commons CC-BY 4.0 (metadata), No License (images follow original copyright)"
      availability: |
        - Original LAION-5B: Taken offline December 2023 (CSAM discovered)
        - Re-LAION-5B: Released August 2024 (2,236 URLs removed, 5.85B → 5.847B pairs)
        - Access: Download via LAION website (parquet files, ~240 GB compressed)
      restrictions: |
        Legal: Users responsible for complying with copyright law (images not licensed by LAION)
        Ethical: LAION removed CSAM URLs but cannot remove cached images or trained models
        Technical: URLs may be dead (link rot), requires bandwidth to download images

    attested_by:
      - name: Asbjørn Ras
        role: analyst
        affiliation: Public Reason Project
        date: "2026-04-07"
        statement: |
          This Layer 1 provenance is reconstructed from public sources (Schuhmann et al. 2022, Thiel 2023,
          LAION blog posts) and represents post-hoc analysis, not original dataset documentation. LAION team
          did not publish detailed exclusion criteria, NSFW thresholds, or safety filtering rationale. Gaps
          marked as "UNKNOWN" indicate undocumented decisions where internal deliberations not public.

# =============================================================================
# LAYER 2: CONSEQUENCE SIMULATION
# =============================================================================
l2_consequence_simulation:

  # ---------------------------------------------------------------------------
  # Affected Population
  # ---------------------------------------------------------------------------
  affected_population:
    total: "Billions (5.85B image-text pairs → estimated 1-2B unique depicted individuals + billions of AI system users)"
    breakdown:
      - group: "Individuals depicted in images"
        count: "1-2 billion (estimated unique individuals across 5.85B images)"
      - group: "CSAM victims (children in abuse imagery)"
        count: "1,008 confirmed (Stanford validation), 3,226 total flagged (LAION internal review)"
      - group: "Medical patients (HIPAA-protected imagery)"
        count: "UNKNOWN (no systematic audit performed)"
      - group: "NCII victims (non-consensual intimate imagery)"
        count: "UNKNOWN (no systematic audit, but likely millions given web scraping of adult content)"
      - group: "Copyright holders (artists, photographers, stock photo companies)"
        count: "Millions (billions of copyrighted images in dataset)"
      - group: "AI researchers using LAION-5B"
        count: "Thousands (2,000+ citations as of 2024)"
      - group: "Commercial AI companies (Stability AI, etc.)"
        count: "10-20 major companies"
      - group: "Generative AI end users (Stable Diffusion, etc.)"
        count: "10+ million (Stable Diffusion downloads by end of 2022)"

  # ---------------------------------------------------------------------------
  # Key Variables
  # ---------------------------------------------------------------------------
  variables:
    - variable_id: VAR1_csam_filtering
      name: "CSAM_filtering_methodology"
      type: categorical
      actual_value: "none"
      alternatives:
        - "hash_only (PhotoDNA/NCMEC hash matching)"
        - "hash_ml_combined (hash + ML classifier + human review sample)"
        - "comprehensive_safety (hash + ML + domain blocking + human review)"
      rationale_for_actual: |
        UNKNOWN - LAION did not document why CSAM filtering was omitted. Possible reasons (speculative):
        (a) Cost: PhotoDNA API costs ~$0.001/image → $5.85M for full dataset
        (b) Compute: Hash matching requires downloading images, not just metadata (storage/bandwidth)
        (c) Legal: Accessing CSAM for filtering may violate 18 U.S.C. § 2252 (possession)
        (d) Ignorance: LAION team may not have considered CSAM risk (academic researchers, not safety experts)
      sensitivity: |
        EXTREME - changing from "none" to "hash_only" prevents 2,236 CSAM URLs (Tier 1 harm, federal crime)
        at cost of $50-100K (PhotoDNA nonprofit rate) + 2-3 months delay. Small input change → massive harm reduction.

    - variable_id: VAR2_medical_privacy
      name: "Medical_privacy_filtering"
      type: categorical
      actual_value: "none"
      alternatives:
        - "domain_blocking (exclude .gov, .edu, telemedicine domains)"
        - "ml_detection (classify medical imagery, remove)"
        - "comprehensive (domain blocking + ML + PHI redaction)"
      rationale_for_actual: |
        UNKNOWN - LAION did not document medical privacy considerations. Likely omitted because:
        (a) Medical imagery small % of dataset (estimated <1%, 50-100M pairs)
        (b) No clear legal requirement (HIPAA applies to covered entities, not web scrapers)
        (c) False positives (medical education content, artistic anatomy, breastfeeding images)
      sensitivity: |
        MODERATE - medical imagery <1% of dataset, but HIPAA violations serious (Tier 2 legal harm).
        Filtering cost: $100-500K (ML classifier + domain blocking). Benefit: prevent legal/ethical harm to patients.

    - variable_id: VAR3_consent_mechanism
      name: "Consent_mechanism"
      type: categorical
      actual_value: "none (opt-out only, post-publication)"
      alternatives:
        - "opt_out_prepublication (allow removal requests before March 2022 release)"
        - "opt_in (only include images with explicit consent for AI training)"
        - "tiered_consent (opt-in for sensitive content, opt-out for general)"
      rationale_for_actual: |
        UNKNOWN - LAION did not document consent rationale. Likely assumptions:
        (a) "Publicly accessible URL" = "consented to all uses" (false, legally and ethically)
        (b) Opt-in infeasible (would require contacting billions of individuals)
        (c) Opt-out sufficient (follows GDPR "legitimate interest" logic, though GDPR untested for AI training)
      sensitivity: |
        RADICAL - opt-in consent would reduce dataset size 95%+ (most web users unaware, wouldn't opt in).
        Unclear if 95% smaller dataset trains comparable models (untested empirical question). Could be:
        (a) Minor impact (quality > quantity, 250M high-quality consented images sufficient)
        (b) Catastrophic (long-tail diversity critical for generative models, 95% loss breaks performance)

    - variable_id: VAR4_human_review
      name: "Human_review_percentage"
      type: continuous
      actual_value: "0"
      units: "percentage of dataset manually inspected"
      alternatives:
        - "0.01 (50,000 images, industry minimum for validation)"
        - "0.1 (500,000 images, robust sampling)"
        - "1.0 (5.85M images, comprehensive audit)"
      rationale_for_actual: |
        Cost/feasibility - manual review at 10 seconds/image costs:
        - 0.01%: $100K (50K images × $2/image labor cost)
        - 0.1%: $1M (500K images)
        - 1.0%: $10M (5.85M images)
        LAION budget estimated $1-5M total (compute, storage, labor), likely could not afford >0.01% review.
      sensitivity: |
        MODERATE - 0.01% review (50K images) would catch obvious CSAM, medical, NCII issues before publication,
        providing feedback to improve automated classifiers. Cost: $100K. Benefit: detect systematic failures
        (e.g., NSFW classifier missing CSAM) before distributing 5.85B pairs.

    - variable_id: VAR5_distribution_structure
      name: "Distribution_structure"
      type: categorical
      actual_value: "federated (URLs only, no image hosting)"
      alternatives:
        - "hosted_images (download and serve images directly)"
        - "hybrid (cache subset of images, URLs for rest)"
      rationale_for_actual: |
        Cost/legal - hosting 5.85B images costs:
        (a) Storage: ~50-100 PB raw (assuming avg 10 MB/image) = $10-50M/year cloud storage
        (b) Bandwidth: ~100-500 PB downloads (1,000s researchers × 5.85B images) = $10-50M bandwidth
        (c) DMCA: Hosting copyrighted images increases legal liability vs. URLs (takedown burden on LAION)
        Federated saves $20-100M but sacrifices remediation capability (can't remove cached images).
      sensitivity: |
        LOW for prevention (CSAM harm occurs whether hosted or federated), HIGH for remediation (hosted enables
        deletion post-discovery, federated does not). Trade-off: upfront cost ($20-100M) vs. remediation capability.

  # ---------------------------------------------------------------------------
  # Core Assumptions
  # ---------------------------------------------------------------------------
  assumptions:
    - assumption_id: A1_public_equals_consented
      description: |
        "Publicly accessible web content is consented to all uses, including AI training"
      justification: UNKNOWN (not explicitly stated by LAION, inferred from lack of consent mechanism)
      confidence: low (legal precedent unclear, GDPR case law developing, ethical consensus against)
      sensitivity: |
        EXTREME - if false, entire dataset based on non-consensual data extraction. Alternative assumption:
        "Web content consented to viewing, not AI training" would require opt-in consent, reducing dataset 95%+.
      testable: yes
      test_method: |
        Legal: Await court rulings on AI training fair use (Getty Images v. Stability AI, Andersen v. Stability AI)
        Empirical: Survey web users on consent expectations (e.g., "Did you consent to Flickr uploads training AI?")
      evidence_for: "US fair use doctrine (transformative use), robots.txt exclusions (LAION respected some)"
      evidence_against: "EU GDPR (legitimate interest untested), user surveys (most web users object to AI training without consent)"

    - assumption_id: A2_clip_safety_sufficient
      description: |
        "CLIP similarity + NSFW classifier sufficient for safety (no additional CSAM, medical, consent filtering needed)"
      justification: UNKNOWN (not documented, inferred from lack of additional filtering)
      confidence: very-low (Stanford report disproved - 3,226 CSAM URLs found)
      sensitivity: |
        EXTREME - assumption FALSE (empirically disproven). CLIP cannot detect CSAM (age), medical privacy (context),
        consent (intent). Failure to add hash matching → 21 months federal crime distribution.
      testable: yes (already tested and failed)
      test_method: "Audit dataset for CSAM (Stanford did this, found 3,226 URLs)"
      evidence_for: "None (assumption disproven)"
      evidence_against: "Stanford Internet Observatory report (Thiel 2023), Re-LAION-5B (2,236 URLs removed Aug 2024)"

    - assumption_id: A3_opt_out_sufficient
      description: |
        "Opt-out (removal upon request) sufficient for consent, no opt-in needed"
      justification: |
        Inferred from LAION's "Have I Been Trained?" opt-out tool (launched 2023, post-CSAM discovery).
        Aligns with GDPR "legitimate interest" logic (data processing lawful unless individual objects).
      confidence: medium (legal basis exists, ethical debate ongoing)
      sensitivity: |
        MODERATE - opt-out requires individuals to DISCOVER they're in dataset (impossible for billions),
        REQUEST removal (friction), and WAIT for removal (delay). Systematic under-removal likely.
        Alternative (opt-in) would reduce dataset 95%+ but ensure genuine consent.
      testable: yes
      test_method: |
        Empirical: Measure opt-out uptake (how many of 1-2B depicted individuals requested removal?)
        LAION reports ~10M opt-out requests by 2024 (<1% of depicted individuals), suggesting opt-out insufficient.
      evidence_for: "GDPR legitimate interest, common practice in web scraping"
      evidence_against: "Low opt-out uptake (<1%), power imbalance (individuals vs. LAION), discovery burden"

    - assumption_id: A4_link_rot_acceptable
      description: |
        "50% of URLs becoming inaccessible within 2 years is acceptable trade-off for cost savings (federated structure)"
      justification: |
        Cost savings ($20-100M avoided by not hosting images) outweigh reproducibility loss. Researchers can
        download images immediately upon dataset release (March 2022), cache locally.
      confidence: medium (cost-benefit depends on use case)
      sensitivity: |
        MODERATE - link rot harms reproducibility (cannot re-train models with same data in 2024 as 2022),
        but does not harm safety (dead URLs don't distribute CSAM). Trade-off: cost vs. science quality.
      testable: yes
      test_method: "Measure URL availability over time (March 2022 → March 2024), estimate % accessible"
      evidence_for: "Standard practice in web datasets (Common Crawl, Imagen), researchers cache images locally"
      evidence_against: "Reproducibility crisis in AI (cannot verify Stable Diffusion training if URLs dead)"

  # ---------------------------------------------------------------------------
  # Scenarios
  # ---------------------------------------------------------------------------
  scenarios:
    - scenario_id: S1_actual_constitution
      name: "Actual LAION-5B (No CSAM Filtering, March 2022)"
      description: |
        Dataset as published March 2022: CLIP filtering + minimal NSFW classifier, zero CSAM hash matching,
        zero medical privacy filtering, zero consent mechanism, federated distribution (URLs only).

      variable_values:
        CSAM_filtering_methodology: "none"
        Medical_privacy_filtering: "none"
        Consent_mechanism: "none (opt-out only, post-publication)"
        Human_review_percentage: "0"
        Distribution_structure: "federated"

      outcomes:
        - outcome: "CSAM distribution (3,226 URLs, 1,008 confirmed)"
          magnitude: "Severe (Tier 1 harm - criminal/safety)"
          confidence: very-high
          evidence: "Stanford Internet Observatory report (Thiel 2023), LAION takedown (Dec 2023)"
          affected_population: "1,008 confirmed CSAM victims (children), plus downstream users (10M+ Stable Diffusion users)"

        - outcome: "Medical privacy violations (UNKNOWN scale)"
          magnitude: "Moderate (Tier 2-3 harm - legal/ethical)"
          confidence: medium
          evidence: "No systematic audit, but Common Crawl includes medical domains (telemedicine, patient forums)"
          affected_population: "UNKNOWN medical patients (estimated thousands-millions)"

        - outcome: "NCII distribution (UNKNOWN scale)"
          magnitude: "Moderate (Tier 3 harm - ethical)"
          confidence: medium
          evidence: "No systematic audit, but Common Crawl scrapes adult content websites (revenge porn likely)"
          affected_population: "UNKNOWN NCII victims (estimated millions)"

        - outcome: "Copyright infringement at scale"
          magnitude: "Large (Tier 4 harm - economic)"
          confidence: very-high
          evidence: "Getty Images lawsuit ($1.8T damages claimed), Andersen v. Stability AI class action"
          affected_population: "Millions of artists, photographers, stock photo companies"

        - outcome: "Generative AI acceleration (Stable Diffusion, Aug 2022)"
          magnitude: "Large benefit (open-source AI, 10M+ users)"
          confidence: very-high
          evidence: "Stable Diffusion trained on LAION-2B-en subset, 10M downloads by end of 2022"
          affected_population: "10M+ generative AI users, thousands of researchers"

        - outcome: "Western/English bias propagation"
          magnitude: "Large (Tier 5 harm - bias)"
          confidence: very-high
          evidence: "2.32B English pairs (40% of dataset), non-Western cultures under-represented"
          affected_population: "Billions of non-Western AI users (biased outputs)"

    - scenario_id: S2_hash_matching_prepublication
      name: "CSAM Hash Matching (Counterfactual - Pre-Publication Filtering)"
      description: |
        Counterfactual scenario: LAION performs PhotoDNA/NCMEC hash matching before March 2022 release.
        Cost: $50-100K (nonprofit rate), 2-3 months delay. Removes 2,236 CSAM URLs (Re-LAION-5B count).

      variable_values:
        CSAM_filtering_methodology: "hash_only (PhotoDNA/NCMEC)"
        Medical_privacy_filtering: "none"
        Consent_mechanism: "none"
        Human_review_percentage: "0"
        Distribution_structure: "federated"

      outcomes:
        - outcome: "Known CSAM excluded from distribution"
          magnitude: "Major benefit (Tier 1 harm prevented)"
          confidence: very-high
          evidence: "Re-LAION-5B removed 2,236 URLs (Aug 2024), these would not have been distributed March 2022"
          affected_population: "1,008 confirmed CSAM victims protected from re-victimization"

        - outcome: "21-month harm window eliminated"
          magnitude: "Major benefit (March 2022 - Dec 2023 CSAM distribution prevented)"
          confidence: very-high
          evidence: "Original LAION-5B distributed CSAM for 21 months before Stanford discovery"
          affected_population: "Thousands of researchers, millions of users, 1,008 victims"

        - outcome: "Federal crime avoided"
          magnitude: "Major benefit (18 U.S.C. § 2252 strict liability)"
          confidence: very-high
          evidence: "CSAM distribution is federal crime regardless of intent, hash matching prevents liability"
          affected_population: "LAION team (legal protection), CSAM victims (harm prevention)"

        - outcome: "2-3 month publication delay"
          magnitude: "Minor cost (March 2022 → June 2022 release)"
          confidence: high
          evidence: "Hash matching requires downloading images (bandwidth), API calls (time), human review (validation)"
          affected_population: "AI researchers (delayed access to dataset)"

        - outcome: "Cost: $50-100K"
          magnitude: "Negligible cost (0.5-1% of LAION-5B total budget)"
          confidence: high
          evidence: "PhotoDNA API nonprofit rate ~$0.001/image × 50-100M images (sample, not full 5.85B)"
          affected_population: "LAION team (budget impact minimal)"

      comparison_to_actual: |
        BENEFIT-COST RATIO: Prevent federal crime ($0 financial value, infinite moral value) vs. $50-100K + 2-3
        months delay. Ratio: INFINITE (no amount of cost justifies CSAM distribution).

        LAION chose S1 (actual) over S2 (hash matching) for UNKNOWN reasons. Possible explanations:
        (a) Ignorance (did not consider CSAM risk)
        (b) Cost-benefit error (underweighted Tier 1 harm, overweighted delay)
        (c) Legal confusion (thought federated URLs exempt from 18 U.S.C. § 2252, incorrect)
        (d) Technical difficulty (hash matching requires downloading images, added complexity)

    - scenario_id: S3_comprehensive_safety
      name: "Comprehensive Safety Filtering (Counterfactual - Hash + ML + Human Review)"
      description: |
        Counterfactual scenario: LAION implements multi-layered safety filtering:
        (a) CSAM hash matching (PhotoDNA/NCMEC)
        (b) Medical image classifier (remove HIPAA-protected imagery)
        (c) NCII detection (ML classifier + human review sample)
        (d) 0.01% human review (50,000 images for validation)
        Cost: $1-1.5M total, 4-6 months delay.

      variable_values:
        CSAM_filtering_methodology: "hash_ml_human (hash + ML classifier + human review)"
        Medical_privacy_filtering: "ml_detection (medical image classifier)"
        Consent_mechanism: "none (opt-out only)"
        Human_review_percentage: "0.01 (50,000 images)"
        Distribution_structure: "federated"

      outcomes:
        - outcome: "Known + unknown CSAM excluded"
          magnitude: "Major benefit (Tier 1 harm prevented, beyond hash-only)"
          confidence: high
          evidence: "ML classifiers detect novel CSAM (not in hash databases), human review catches edge cases"
          affected_population: "1,008+ CSAM victims (hash matching) + UNKNOWN additional (ML detection)"

        - outcome: "Medical privacy violations prevented"
          magnitude: "Moderate benefit (Tier 2-3 harm prevented)"
          confidence: medium
          evidence: "Medical image classifiers 80-90% accurate (some false positives/negatives), but reduces HIPAA risk"
          affected_population: "UNKNOWN medical patients (estimated thousands-millions protected)"

        - outcome: "NCII partially excluded"
          magnitude: "Moderate benefit (Tier 3 harm reduced)"
          confidence: medium
          evidence: "NCII detection hard (visually similar to consensual content), but human review catches obvious cases"
          affected_population: "UNKNOWN NCII victims (estimated partial reduction, not elimination)"

        - outcome: "Dataset size reduction: 5.85B → ~5.5B (5% loss)"
          magnitude: "Minor cost (long-tail diversity reduced)"
          confidence: medium
          evidence: "Safety filtering removes edge cases (medical, NCII, CSAM), some legitimate content (false positives)"
          affected_population: "AI researchers (slightly smaller dataset, likely negligible model performance impact)"

        - outcome: "Cost: $1-1.5M (10-30% of total budget)"
          magnitude: "Moderate cost (but within feasibility for $5M project)"
          confidence: high
          evidence: "CSAM hash $50-100K + medical ML $200-500K + NCII ML $200-500K + human review $400K + compute $100K"
          affected_population: "LAION team (budget impact significant but manageable)"

        - outcome: "4-6 month publication delay (March 2022 → July-Sep 2022)"
          magnitude: "Moderate cost (delayed AI research)"
          confidence: medium
          evidence: "ML training (2-3 months), human review (1-2 months), compute (1 month) sequential"
          affected_population: "AI researchers (delayed Stable Diffusion → Dec 2022 instead of Aug 2022?)"

      comparison_to_actual: |
        BENEFIT-COST RATIO: Prevent Tier 1-3 harms (CSAM, HIPAA, NCII) vs. $1-1.5M + 4-6 months + 5% dataset shrinkage.
        Ratio: HIGH (federal crime prevention + legal compliance + ethical integrity vs. moderate cost/delay).

        KEY QUESTION: Would 5% smaller, 4-6 months delayed dataset significantly harm AI research?
        Answer: UNLIKELY. Stable Diffusion (Aug 2022) used LAION-2B-en subset (2.32B pairs, 40% of full 5.85B).
        Suggests dataset size flexible, quality > quantity. 5.5B (S3) vs. 5.85B (S1) negligible difference.

    - scenario_id: S4_consent_based_opt_in
      name: "Consent-Based Dataset (Counterfactual - Opt-In Only)"
      description: |
        Radical counterfactual: LAION only includes images where depicted individuals/copyright holders
        explicitly consented to AI training use. Requires partnerships with stock photo companies (Getty,
        Shutterstock opted-in tiers), Creative Commons BY licenses, Flickr users who check "AI training OK" box.
        Scale: Estimated 50-250M pairs (95%+ reduction from 5.85B), cost similar to S1 (no additional filtering,
        but curation labor $500K-1M).

      variable_values:
        CSAM_filtering_methodology: "none_needed (consent mechanism excludes CSAM by design)"
        Medical_privacy_filtering: "none_needed (consent excludes medical imagery)"
        Consent_mechanism: "opt_in (explicit consent required)"
        Human_review_percentage: "0.1 (500,000 images to validate consent)"
        Distribution_structure: "federated or hosted (cost similar)"

      outcomes:
        - outcome: "Zero CSAM (by design)"
          magnitude: "Major benefit (Tier 1 harm eliminated)"
          confidence: very-high
          evidence: "Consent mechanisms exclude minors (cannot consent), CSAM inherently non-consensual"
          affected_population: "All potential CSAM victims protected"

        - outcome: "Zero medical privacy violations"
          magnitude: "Major benefit (Tier 2 harm eliminated)"
          confidence: very-high
          evidence: "Patients unlikely to consent to medical imagery for AI training (privacy expectations)"
          affected_population: "All medical patients protected"

        - outcome: "Zero NCII"
          magnitude: "Major benefit (Tier 3 harm eliminated)"
          confidence: very-high
          evidence: "Consent requirement excludes revenge porn, hacked images, stolen content"
          affected_population: "All NCII victims protected"

        - outcome: "Minimal copyright issues"
          magnitude: "Major benefit (Tier 4 harm minimized)"
          confidence: high
          evidence: "Opt-in includes license verification (CC-BY, paid stock licenses), lawsuits unlikely"
          affected_population: "Copyright holders protected, LAION legal risk minimized"

        - outcome: "Dataset size: 50-250M pairs (95%+ reduction)"
          magnitude: "UNKNOWN cost (untested whether small consented dataset trains comparable models)"
          confidence: very-low
          evidence: "No large-scale generative models trained on consent-only datasets (empirical gap)"
          affected_population: "AI researchers (unknown impact on model quality)"

        - outcome: "Western bias likely WORSE (consent infrastructure concentrated in Global North)"
          magnitude: "Moderate cost (Tier 5 harm amplified)"
          confidence: high
          evidence: "Stock photo companies, CC-BY content, consent tools disproportionately Western/English"
          affected_population: "Non-Western communities (even less represented than S1)"

      comparison_to_actual: |
        ETHICAL TRADE-OFF: S4 eliminates Tier 1-4 harms (CSAM, medical, NCII, copyright) but:
        (a) Unknown if 250M consented images trains viable models (vs. 5.85B non-consented)
        (b) Likely amplifies Western bias (consent infrastructure Western-heavy)
        (c) Delays open-source AI (smaller dataset → worse models → proprietary labs win?)

        CRITICAL UNKNOWN: Is dataset size (5.85B) necessary for Stable Diffusion quality, or would 250M
        high-quality consented images suffice? No empirical evidence either way (untested). If quality >
        quantity, S4 superior on all dimensions. If quantity critical, S4 kills open-source generative AI.

        LAION chose S1 (non-consented scale) over S4 (consented small) likely because:
        (a) Assumed scale necessary (untested)
        (b) Consent infrastructure non-existent in 2021-2022 (no "AI training consent" checkboxes on Flickr)
        (c) Competitive pressure (proprietary labs use non-consented data, open-source must match scale)

  # ---------------------------------------------------------------------------
  # Sensitivity Analysis
  # ---------------------------------------------------------------------------
  sensitivity_analysis: |
    CRITICAL VARIABLE: CSAM_filtering_methodology
    - Changing from "none" (S1 actual) to "hash_only" (S2) eliminates 2,236 known CSAM URLs → prevents Tier 1
      harm at 5-10% of dataset cost ($50-100K vs $1-5M LAION-5B total). Sensitivity: EXTREME - small input
      change (add hash matching) prevents federal crime distribution.
    - Changing to "hash_ml_human" (S3) catches additional unknown CSAM + medical + NCII → prevents Tier 1-3
      harms at 50-100% of dataset cost ($1-1.5M). Sensitivity: VERY HIGH - moderate input change prevents
      multiple harm tiers.

    MODERATE VARIABLE: Human_review_percentage
    - 0% (S1 actual) → 0.01% (S3) detects systematic issues pre-publication. Cost: $400K, 2 months delay.
      Benefit: Catches edge cases, validates classifiers, provides feedback loop. Sensitivity: MODERATE -
      0.01% sample small but representative, catches obvious failures (CSAM, medical, explicit NCII).

    LOW SENSITIVITY: Distribution_structure
    - Federated (S1-S3) vs Hosted (S4) affects remediation capability (can't retrieve cached images) but
      doesn't prevent harm proactively. Storage cost difference: ~$10-50M saved by federated. Sensitivity: LOW
      for prevention (harm occurs either way), HIGH for remediation (hosted enables image deletion post-discovery).

    RADICAL VARIABLE: Consent_mechanism
    - None (S1-S3) vs Opt-in (S4) eliminates all involuntary content but reduces scale 95%+. Untested whether
      95% smaller dataset trains comparable models. Sensitivity: UNKNOWN (empirical gap) - could be minor (quality
      matters more than quantity) or catastrophic (long tail diversity critical for generative models).

  # ---------------------------------------------------------------------------
  # Limitations and Unknowns
  # ---------------------------------------------------------------------------
  limitations_and_unknowns:
    - limitation: "No internal LAION documentation available"
      impact: |
        This Layer 2 analysis reconstructed from public sources (papers, blog posts, Stanford report). Cannot
        verify internal deliberations (e.g., "Why no CSAM filtering?" - UNKNOWN, not documented). Scenarios
        S2-S4 are counterfactuals, not actual alternatives LAION considered.

    - limitation: "Cost estimates speculative"
      impact: |
        PhotoDNA pricing, ML training costs, human review rates estimated from industry standards (Microsoft,
        Scale AI public pricing). Actual LAION budget unknown ($1-5M range estimated from compute/labor). Cost
        figures ±50% uncertainty.

    - limitation: "Counterfactual model quality unknown (S4 consent-based)"
      impact: |
        No large-scale generative models trained on consent-only datasets. Cannot assess whether 250M consented
        images (S4) would produce Stable Diffusion-quality models or fail catastrophically. Empirical gap prevents
        definitive S1 vs S4 comparison.

    - limitation: "Harm quantification incomplete (medical, NCII)"
      impact: |
        CSAM quantified (3,226 URLs, 1,008 validated), but medical privacy violations and NCII victims UNKNOWN
        (no systematic audit). May significantly underestimate Tier 2-3 harms in S1 outcomes.

    - limitation: "Link rot makes retrospective audit hard"
      impact: |
        50% of LAION-5B URLs dead by 2024 (link rot). Cannot fully audit dataset for medical/NCII content
        post-hoc. Harm estimates based on partial data (accessible URLs only).

  # ---------------------------------------------------------------------------
  # Notes
  # ---------------------------------------------------------------------------
  notes: |
    CRITICAL VARIABLE: CSAM_filtering_methodology - changing from "none" to "hash_only" eliminates 2,236 known
    CSAM URLs, prevents Tier 1 harm at 5-10% of dataset cost ($50-100K vs $1-5M LAION-5B total). Small input
    change prevents federal crime distribution.

    RADICAL VARIABLE: Consent_mechanism - None (S1-S3) vs Opt-in (S4) eliminates all involuntary content but
    reduces scale 95%+. Untested whether 95% smaller dataset trains comparable models. Empirical gap.

# =============================================================================
# LAYER 3: EMPATHY MAPPING
# =============================================================================
# Who is affected by this dataset and how? Focus on representation disparities,
# absent nodes, vulnerable populations, and distributional welfare.

l3_empathy_mapping:

  # ---------------------------------------------------------------------------
  # Affected Population Overview
  # ---------------------------------------------------------------------------
  affected_population:
    total_scale: billions (estimated 5+ billion people depicted or affected globally)
    geographic_scope: Global (Common Crawl sources from worldwide web, dataset used internationally)
    temporal_scope: |
      Immediate (March 2022 - December 2023): 5.85 billion URL distribution including 3,226 CSAM URLs
      Long-term (2022 - present): Generative AI models (Stable Diffusion, etc.) trained on LAION-derived
      datasets continue to be used billions of times, perpetuating representation biases and safety gaps.

    direct_stakeholders: |
      - LAION team (creators, 20-30 people)
      - AI researchers using dataset (thousands globally)
      - Commercial AI companies (Stability AI, etc., using LAION for training)
      - Generative AI users (millions creating images from LAION-trained models)

    indirect_stakeholders: |
      - Individuals depicted in images (billions, involuntary participants)
      - CSAM victims (children depicted in abuse material - no consent possible)
      - Medical patients (appearing in HIPAA-violating imagery)
      - Non-consensual intimate imagery (NCII) victims
      - Copyright holders (artists, photographers, Getty Images, etc.)
      - Web users generally (anyone whose uploaded content became training data)
      - Non-Western communities (under-represented in dataset, biased model outputs)

  # ---------------------------------------------------------------------------
  # Stakeholder Groups (10 groups with representation analysis)
  # ---------------------------------------------------------------------------
  stakeholder_groups:

    # -------------------------------------------------------------------------
    # Group 1: LAION Team (Creators) - HIGH REPRESENTATION
    # -------------------------------------------------------------------------
    - group_id: SG1_laion_team
      name: LAION Team (Dataset Creators)
      size: 20-30 core contributors
      representation_in_governance: FULL (100%)
      decision_power: Complete (constitutive authority over dataset design, filtering, distribution)

      benefits:
        - Academic recognition (publications: Schuhmann et al. 2021, 2022)
        - Community reputation (enabling open-source generative AI)
        - Influence over AI research direction (5.85B scale set standard for image-text datasets)

      harms:
        - Reputational damage (CSAM discovery December 2023, criminal investigation concerns)
        - Legal exposure (potential CSAM distribution liability under 18 U.S.C. § 2252)
        - Moral distress (discovering dataset facilitated child exploitation)

      representation_gap: NONE (authors fully represented in decision-making)
      harm_severity: TIER 2 - LEGAL (potential criminal liability), TIER 3 - ETHICAL (reputational)

    # -------------------------------------------------------------------------
    # Group 2: AI Researchers & Community - HIGH REPRESENTATION
    # -------------------------------------------------------------------------
    - group_id: SG2_researchers
      name: AI Researchers & Academic Community
      size: Thousands globally (LAION-5B cited 2,000+ times as of 2024)
      representation_in_governance: HIGH (researchers participated in LAION Discord, provided feedback)
      decision_power: Medium (influenced feature requests, flagged issues, but no constitutive authority)

      benefits:
        - Open access to state-of-the-art dataset (vs proprietary alternatives like Google's JFT-300M)
        - Research publications enabled (Stable Diffusion, DALL-E 2 reproductions, etc.)
        - Accelerated research timelines (LAION-5B available March 2022, Stable Diffusion Aug 2022)

      harms:
        - Ethical compromise (using dataset with CSAM, NCII, medical privacy violations)
        - Research invalidation risk (results based on compromised data may be questioned)
        - Complicity concerns (benefiting from child exploitation imagery)

      representation_gap: MODERATE (voice heard but not decision-making authority)
      harm_severity: TIER 3 - ETHICAL (complicity, research integrity)

    # -------------------------------------------------------------------------
    # Group 3: Commercial AI Companies - HIGH REPRESENTATION
    # -------------------------------------------------------------------------
    - group_id: SG3_commercial_companies
      name: Commercial AI Companies (Stability AI, etc.)
      size: 10-20 major companies using LAION for training
      representation_in_governance: HIGH (Stability AI founder funded LAION infrastructure)
      decision_power: Medium-High (financial influence, early access, feature requests)

      benefits:
        - Free training data ($0 licensing cost vs millions for curated datasets)
        - Competitive advantage (Stability AI released Stable Diffusion Aug 2022, ahead of DALL-E 2 API)
        - Revenue generation (Stability AI valued at $1 billion, DreamStudio subscriptions)

      harms:
        - Legal liability (potential copyright infringement lawsuits - Getty Images v. Stability AI Jan 2023)
        - Brand damage (association with CSAM distribution, NCII generation capabilities)
        - Regulatory scrutiny (EU AI Act high-risk classification, UK Online Safety Act)

      representation_gap: MINIMAL (companies had significant influence on dataset priorities)
      harm_severity: TIER 2 - LEGAL (copyright, CSAM liability), TIER 4 - ECONOMIC (lawsuit damages)

    # -------------------------------------------------------------------------
    # Group 4: Generative AI Users - LOW REPRESENTATION
    # -------------------------------------------------------------------------
    - group_id: SG4_ai_users
      name: Generative AI End Users
      size: Millions (Stable Diffusion 10M+ users by end of 2022)
      representation_in_governance: NONE (no input into LAION-5B dataset constitution)
      decision_power: None (downstream recipients of model outputs)

      benefits:
        - Access to generative AI tools (Stable Diffusion open-sourced Aug 2022)
        - Creative capabilities (text-to-image generation, artistic applications)
        - Low/no cost (vs proprietary tools like DALL-E 2, Midjourney subscriptions)

      harms:
        - Unintentional CSAM generation (models trained on LAION reproduce abusive imagery)
        - Legal exposure (generating/possessing CSAM-adjacent content unknowingly)
        - Ethical complicity (using tools trained on exploitation imagery)
        - Bias propagation (models reproduce Western/male biases in outputs)

      representation_gap: SEVERE (billions of uses, zero governance representation)
      harm_severity: TIER 1-2 (CSAM generation risk), TIER 3 (ethical complicity), TIER 5 (bias)

    # -------------------------------------------------------------------------
    # Group 5: CHILDREN DEPICTED IN CSAM - CRITICAL ABSENT NODE (TIER 1)
    # -------------------------------------------------------------------------
    - group_id: SG5_csam_victims
      name: Children Depicted in Child Sexual Abuse Material
      size: UNKNOWN (Stanford found 3,226 CSAM URLs, 1,008 externally validated)
      representation_in_governance: NONE (absolute absence - victims cannot consent, images illegal)
      decision_power: None (zero representation, zero remediation, zero notification)

      benefits: NONE

      harms:
        - TIER 1 - CRIMINAL/SAFETY: Re-victimization (CSAM distribution perpetuates original abuse)
        - TIER 1 - CRIMINAL/SAFETY: Normalization of abuse (models trained on CSAM may generate similar imagery)
        - TIER 2 - LEGAL: Violation of federal law (18 U.S.C. § 2252 - CSAM distribution)
        - TIER 3 - ETHICAL: Dignity violation (children's images exploited without any possible consent)
        - TIER 3 - ETHICAL: Lifetime trauma (victims may discover their abuse imagery trained AI models)

      representation_gap: ABSOLUTE AND IRREMEDIABLE (children cannot consent, no mechanism for voice)
      harm_severity: TIER 1 - CRIMINAL/SAFETY (child protection is absolute priority, federal crime)

      vulnerable_population_flags:
        - Children (cannot provide informed consent under any circumstance)
        - Crime victims (CSAM production is inherently abusive, coercive)
        - Lifelong harm (re-victimization continues as long as imagery circulates)
        - Legal protection (18 U.S.C. § 2252, NCMEC mandatory reporting, strict liability)

      notes: |
        This is the MOST CRITICAL absent node in LAION-5B. Unlike other stakeholder groups (copyright
        holders, medical patients, NCII victims), CSAM victims are children who:
        1. Cannot consent to image collection (legal incapacity)
        2. Cannot consent to CSAM creation (inherently coercive, illegal)
        3. Cannot be notified or remediated (identifying victims would require viewing illegal content)
        4. Suffer TIER 1 harm (criminal/safety) not amenable to utilitarian trade-offs

        ORP's value here: If LAION had used Layer 3 empathy mapping BEFORE publication, this stakeholder
        group would have been identified as "vulnerable population requiring absolute protection," triggering
        Layer 2 scenario analysis (S2: hash matching) at negligible cost ($50-100K, 2-3 month delay) to
        prevent 12+ months of federal crime distribution.

    # -------------------------------------------------------------------------
    # Group 6: Medical Patients - ABSENT NODE (TIER 2)
    # -------------------------------------------------------------------------
    - group_id: SG6_medical_patients
      name: Medical Patients (HIPAA-Protected Individuals)
      size: UNKNOWN (no systematic audit for medical imagery in LAION-5B)
      representation_in_governance: NONE (patients unaware their medical data in dataset)
      decision_power: None (no consent mechanism, no notification, no opt-out)

      benefits: NONE (involuntary participants)

      harms:
        - TIER 2 - LEGAL: HIPAA violations (medical imagery scraped from web may include PHI)
        - TIER 3 - ETHICAL: Privacy violation (medical conditions exposed without consent)
        - TIER 3 - ETHICAL: Dignity harm (sensitive health information becomes training data)
        - TIER 4 - ECONOMIC: Discrimination risk (models trained on medical data may reveal conditions)

      representation_gap: ABSOLUTE (patients have no idea their data is in LAION-5B)
      harm_severity: TIER 2 - LEGAL (HIPAA), TIER 3 - ETHICAL (privacy, dignity)

      vulnerable_population_flags:
        - Health data subjects (HIPAA-protected class)
        - Privacy expectation (medical information presumed confidential)
        - No consent mechanism (web scraping bypasses medical consent protocols)

      notes: |
        Common Crawl (LAION-5B source) includes URLs from medical websites, telemedicine platforms, patient
        forums. No filtering for HIPAA-protected health information (PHI) was performed. Unlike CSAM
        (illegal inherently), medical images may be legally posted but ethically protected by healthcare
        privacy norms. Remediation difficulty: identifying medical imagery requires domain expertise,
        no hash databases exist (unlike CSAM).

    # -------------------------------------------------------------------------
    # Group 7: Non-Consensual Intimate Imagery (NCII) Victims - ABSENT NODE (TIER 3)
    # -------------------------------------------------------------------------
    - group_id: SG7_ncii_victims
      name: Non-Consensual Intimate Imagery (NCII) Victims
      size: UNKNOWN (no systematic audit for NCII in LAION-5B, Stanford report focused on CSAM)
      representation_in_governance: NONE (victims unaware their imagery in dataset)
      decision_power: None (no consent, no notification, no removal mechanism until 2023 opt-out)

      benefits: NONE (involuntary participants)

      harms:
        - TIER 3 - ETHICAL: Severe privacy violation (intimate imagery shared without consent)
        - TIER 3 - ETHICAL: Dignity harm (sexual imagery becomes training data)
        - TIER 3 - ETHICAL: Re-victimization (original NCII distribution compounded by AI training)
        - TIER 2 - LEGAL: Potential state law violations (many US states criminalize NCII distribution)
        - TIER 4 - ECONOMIC: Reputational damage (NCII victims face employment, social consequences)

      representation_gap: ABSOLUTE (victims have no idea their imagery in dataset, no notification)
      harm_severity: TIER 3 - ETHICAL (privacy, dignity, consent), TIER 2 - LEGAL (state NCII laws)

      vulnerable_population_flags:
        - Abuse victims (NCII often created through coercion, domestic violence, revenge)
        - Consent violated (images shared against subject's will)
        - Gendered harm (NCII disproportionately affects women)

      notes: |
        "Revenge porn" and non-consensual intimate imagery (NCII) likely present in LAION-5B due to:
        1. Common Crawl scrapes from pornography websites (large % of web traffic)
        2. No consent verification mechanism (assumes posted = consented)
        3. Federated structure (URLs only → can't inspect images for consent markers)

        Unlike CSAM (federal crime, hash databases exist), NCII remediation harder:
        - No centralized hash database for NCII (privacy concerns for victims)
        - State-level laws vary (not uniform federal crime)
        - Victim identification requires self-reporting (many unaware of LAION-5B)

    # -------------------------------------------------------------------------
    # Group 8: Copyright Holders (Artists, Photographers, Getty) - MODERATE REPRESENTATION
    # -------------------------------------------------------------------------
    - group_id: SG8_copyright_holders
      name: Copyright Holders (Artists, Photographers, Stock Photo Companies)
      size: Millions (billions of images in LAION-5B, each with copyright holder)
      representation_in_governance: NONE (creators not consulted, no opt-in mechanism)
      decision_power: None at constitution; Legal recourse post-hoc (lawsuits filed 2022-2023)

      benefits:
        - Potential exposure (AI-generated art may increase interest in original artists - speculative)

      harms:
        - TIER 4 - ECONOMIC: Copyright infringement (images used for commercial AI training without license)
        - TIER 4 - ECONOMIC: Market displacement (generative AI competes with stock photography, illustration)
        - TIER 2 - LEGAL: Litigation costs (Getty Images v. Stability AI, Andersen v. Stability AI class action)
        - TIER 3 - ETHICAL: Attribution failure (no credit given to artists whose work trains models)
        - TIER 4 - ECONOMIC: Devaluation of creative labor (AI produces "in the style of" outputs instantly)

      representation_gap: SEVERE (billions of copyrighted works, zero creator consent)
      harm_severity: TIER 4 - ECONOMIC (market harm, infringement), TIER 2 - LEGAL (lawsuits)

      notes: |
        Multiple lawsuits filed 2022-2023:
        - Getty Images v. Stability AI (Jan 2023): $1.8 trillion in statutory damages claimed
        - Andersen v. Stability AI (Jan 2023): Class action on behalf of artists
        - Legal theory: Fair use defense (Stability AI) vs. derivative works (plaintiffs)

        Key tension: US Copyright Act allows "fair use" for transformative purposes, but generative AI
        outputs can closely mimic training data (watermarks reproduced, recognizable styles). Courts
        have not settled whether AI training is transformative use or infringement.

    # -------------------------------------------------------------------------
    # Group 9: Web Users Generally (Depicted Individuals) - MINIMAL REPRESENTATION
    # -------------------------------------------------------------------------
    - group_id: SG9_web_users_depicted
      name: Web Users Generally (Individuals Depicted in Images)
      size: Billions (5.85 billion image-text pairs likely depict 1-2 billion unique individuals)
      representation_in_governance: NONE (no notification, no consent mechanism, no opt-out until 2023)
      decision_power: None (involuntary participants in training data)

      benefits:
        - Indirect: Access to generative AI tools trained on LAION-5B (if user also uses Stable Diffusion)

      harms:
        - TIER 3 - ETHICAL: Privacy violation (images scraped without individual consent)
        - TIER 5 - BIAS: Biased representation (Western/English-language web over-represented)
        - TIER 3 - ETHICAL: Dignity harm (images used for purposes never intended by uploader/subject)
        - TIER 4 - ECONOMIC: Potential misuse (deepfakes, impersonation, generated from training data)

      representation_gap: SEVERE (billions depicted, zero governance voice)
      harm_severity: TIER 3 - ETHICAL (privacy, dignity), TIER 5 - BIAS (demographic)

      notes: |
        "Depicted individuals" includes:
        - People who uploaded images to social media (Instagram, Flickr, Facebook)
        - People photographed by others who uploaded images
        - People in public spaces captured by street photography
        - People in news imagery, event photography, etc.

        Key issue: Common Crawl scrapes public web, but "publicly accessible" ≠ "consented to AI training."
        Many web users assumed "posted to Flickr" means "friends can see," not "becomes training data for
        global generative AI models." No mechanism to distinguish these consent levels.

    # -------------------------------------------------------------------------
    # Group 10: Non-Western Communities - ABSENT NODE (TIER 5)
    # -------------------------------------------------------------------------
    - group_id: SG10_non_western_communities
      name: Non-Western Communities (Global South, Non-English Speakers)
      size: Billions (80%+ of global population outside Western/English-speaking contexts)
      representation_in_governance: NONE (LAION team primarily Western researchers, dataset Western-skewed)
