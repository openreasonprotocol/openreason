<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fork structure: trunk rises, branches diverge (enlarged, no background) -->
  <!-- Main trunk (bottom to center) -->
  <line x1="16" y1="30" x2="16" y2="16" stroke="#1a5490" stroke-width="3" stroke-linecap="round"/>

  <!-- Left branch (fork diverging) -->
  <path d="M 16 16 Q 10 13, 4 10" fill="none" stroke="#1a5490" stroke-width="3" stroke-linecap="round"/>
  <circle cx="4" cy="10" r="3" fill="#1a5490"/>

  <!-- Right branch (fork diverging) -->
  <path d="M 16 16 Q 22 13, 28 10" fill="none" stroke="#1a5490" stroke-width="3" stroke-linecap="round"/>
  <circle cx="28" cy="10" r="3" fill="#1a5490"/>

  <!-- Center continuation (original line) -->
  <line x1="16" y1="16" x2="16" y2="2" stroke="#1a5490" stroke-width="3" stroke-linecap="round"/>
  <circle cx="16" cy="2" r="3" fill="#1a5490"/>

  <!-- Fork point marker -->
  <circle cx="16" cy="16" r="3.5" fill="#d97706"/>
</svg>
