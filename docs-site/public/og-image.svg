<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0B0C0E"/>
  <defs>
    <pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M90 0 H0 V90" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="18%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#FF5D2A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF5D2A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- orange hexagon -->
  <polygon points="150,150 230,196 230,288 150,334 70,288 70,196"
    fill="none" stroke="#FF5D2A" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- eyebrow -->
  <text x="300" y="180" font-family="'Funnel Display','Inter',sans-serif" font-size="25" letter-spacing="4" fill="#8F9BA8">THE PUBLIC REASON PROJECT</text>

  <!-- headline -->
  <text x="298" y="268" font-family="'Funnel Display','Inter',sans-serif" font-size="74" font-weight="700" fill="#F5F5F5">Reasoning you can <tspan fill="#FF5D2A">verify</tspan></text>
  <text x="298" y="350" font-family="'Funnel Display','Inter',sans-serif" font-size="74" font-weight="700" fill="#F5F5F5">— by people and machines.</text>

  <!-- badge -->
  <text x="300" y="438" font-family="'Funnel Display','Inter',sans-serif" font-size="29" fill="#8F9BA8">OpenReason Protocol · open standard · Apache-2.0</text>
</svg>
