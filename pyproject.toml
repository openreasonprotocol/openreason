[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orp-validator"
version = "0.5.0"
description = "Validator for OpenReason Protocol (ORP) v0.1, v0.2 and v0.3 documents (profiles, trust tiers, attestation)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenReason Contributors", email = "hello@publicreasonproject.org"}
]
maintainers = [
    {name = "Asbjørn Ras", email = "asbjorn@publicreasonproject.org"}
]
keywords = ["orp", "openreason", "transparency", "policy", "validator", "governance", "ai-training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "jsonschema>=4.20.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "importlib-resources>=5.0; python_version < '3.10'",
]

[project.optional-dependencies]
attestation = [
    # ORP v0.3 cryptographic attestation (change C1). Kept optional so core validation stays
    # dependency-light and portable; signature verification degrades gracefully without it.
    "cryptography>=42.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.20.0",
    "cryptography>=42.0",  # so attestation/profile/conformance tests actually run in CI (not skip)
]

[project.scripts]
orp = "orp_validator.main:main"
orp-validate = "orp_validator.cli:main"  # Deprecated, kept for backward compatibility

[project.urls]
Homepage = "https://publicreasonproject.org"
Documentation = "https://publicreasonproject.org/docs"
Repository = "https://gitlab.com/publicreason/orp"
Issues = "https://gitlab.com/publicreason/orp/-/issues"
Changelog = "https://gitlab.com/publicreason/orp/-/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["orp_validator", "orp_validator.commands", "orp_validator.schemas", "orp_validator.templates"]
include-package-data = true

[tool.setuptools.package-data]
orp_validator = ["schemas/*.json", "schemas/conformance/*.json", "schemas/accredited_verifiers.json", "templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers --cov=orp_validator --cov-report=term-missing --cov-report=html"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
# E501 (line-too-long) is owned by the Black formatter: Black wraps code to line-length 100 but
# intentionally does not reflow comments, docstrings, or string literals. Enabling E501 on top of a
# formatter is redundant and only nags about prose the formatter can't split (ruff's own docs recommend
# disabling it when a formatter is in use). Black still guarantees code stays within 100.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["orp_validator"]
